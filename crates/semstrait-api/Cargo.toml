[package]
name = "semstrait-api"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "API layer: gRPC, REST, and CLI entry points for semstrait"

[dependencies]
semstrait-core = { workspace = true }
semstrait-planner = { workspace = true }
semstrait-manifest = { workspace = true }
semstrait-adapter = { workspace = true }
semstrait-ir = { workspace = true }
semstrait-catalog = { workspace = true }
semstrait-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }

# CLI (feature-gated)
clap = { workspace = true, optional = true }

# REST (feature-gated)
axum = { workspace = true, optional = true }

# gRPC (feature-gated)
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tonic-prost = { version = "0.14", optional = true }

[dev-dependencies]
chrono = { workspace = true }
indexmap = { workspace = true }

[build-dependencies]
tonic-build = { version = "0.14", optional = true }
tonic-prost-build = { version = "0.14", optional = true }

[features]
default = ["cli", "rest"]
cli = ["dep:clap"]
rest = ["dep:axum"]
grpc = ["dep:tonic", "dep:prost", "dep:tonic-prost", "dep:tonic-build", "dep:tonic-prost-build"]
datafusion = ["semstrait-adapter/datafusion"]
duckdb = ["semstrait-adapter/duckdb"]
iceberg = ["semstrait-catalog/iceberg", "semstrait-manifest/iceberg"]
unity = ["semstrait-catalog/unity"]
aws = ["semstrait-catalog/aws", "semstrait-manifest/aws", "iceberg"]
spark = ["semstrait-adapter/spark"]

[[bin]]
name = "semstrait"
path = "src/main.rs"
required-features = ["cli"]
