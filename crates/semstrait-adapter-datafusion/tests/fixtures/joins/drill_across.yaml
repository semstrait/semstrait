            + Opt:Trace[semantic_source='ssg2', source_role=&Grainset, cardinality=&OneToOne]
            Aggregate[$1 => $1, sum($0, overflow⇒[ERROR]):i64?]
              Project[$2, $1, $0]
                Read:Virtual[
                  - ('2026-03-01':date, 'A', 100),
