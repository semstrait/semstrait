# A join on IS NOT DISTINCT FROM keeps the NULL group that Eq drops.

not_distinct_from:
  # A join of two Metric subtrees on IS NOT DISTINCT FROM keeps the NULL group.
  request:
    select: [channel, regions_with_revenue, buyers]
  expect:
    rows:
      - [channel, regions_with_revenue, buyers]
      - [web, 2, 1]
      - [app, 1, 1]
      - [null, 1, 1]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_aggregate_generic
      @  2: extension:io.substrait:functions_arithmetic
      @  3: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: count
      #  2 @  2: sum
      #  3 @  3: is_not_distinct_from

    === Plan
    Root[channel, regions_with_revenue, buyers]
      Project[$0, $3, $1]
        Join[&Inner, is_not_distinct_from($0, $2):boolean => $0, $1, $2, $3]
          Aggregate[$1 => $1, count($2, overflow⇒[ERROR]):i64]
            Project[$3, $2, $0, $1]
              Read:Virtual[
                - ('c1', 'eu', 'web', 100),
                - ('c1', 'eu', 'app', 50),
                - ('c1', 'us', 'web', 200),
                - ('c2', 'us', null:string?, 10)
                - => customer_id:string?, region:string?, channel:string?, amount:i64?]
          Aggregate[$0 => $0, count($2, overflow⇒[ERROR]):i64]
            Aggregate[$1, $3 => $1, $3, sum($0, overflow⇒[ERROR]):i64?]
              Project[$3, $2, $0, $1]
                Read:Virtual[
                  - ('c1', 'eu', 'web', 100),
                  - ('c1', 'eu', 'app', 50),
                  - ('c1', 'us', 'web', 200),
                  - ('c2', 'us', null:string?, 10)
                  - => customer_id:string?, region:string?, channel:string?, amount:i64?]

equal_control:
  # The same join on Eq, not IS NOT DISTINCT FROM, drops the NULL group.
  request:
    select: [channel, regions_with_revenue, buyers]
  expect:
    rows:
      - [channel, regions_with_revenue, buyers]
      - [web, 2, 1]
      - [app, 1, 1]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_aggregate_generic
      @  2: extension:io.substrait:functions_arithmetic
      @  3: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: count
      #  2 @  2: sum
      #  3 @  3: equal

    === Plan
    Root[channel, regions_with_revenue, buyers]
      Project[$0, $3, $1]
        Join[&Inner, equal($0, $2):boolean? => $0, $1, $2, $3]
          Aggregate[$1 => $1, count($2, overflow⇒[ERROR]):i64]
            Project[$3, $2, $0, $1]
              Read:Virtual[
                - ('c1', 'eu', 'web', 100),
                - ('c1', 'eu', 'app', 50),
                - ('c1', 'us', 'web', 200),
                - ('c2', 'us', null:string?, 10)
                - => customer_id:string?, region:string?, channel:string?, amount:i64?]
          Aggregate[$0 => $0, count($2, overflow⇒[ERROR]):i64]
            Aggregate[$1, $3 => $1, $3, sum($0, overflow⇒[ERROR]):i64?]
              Project[$3, $2, $0, $1]
                Read:Virtual[
                  - ('c1', 'eu', 'web', 100),
                  - ('c1', 'eu', 'app', 50),
                  - ('c1', 'us', 'web', 200),
                  - ('c2', 'us', null:string?, 10)
                  - => customer_id:string?, region:string?, channel:string?, amount:i64?]
