# A re-aggregated count coalesces to zero where no partial aggregate reaches it (ADR 0079).

empty_union_branch:
  # A re-aggregated count over a Unionset's empty branch coalesces to zero.
  request:
    select: [order_count]
  expect:
    rows:
      - [order_count]
      - [0]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
      @  2: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: sum
      #  2 @  2: coalesce

    === Plan
    Root[order_count]
      Project[coalesce($0, 0):i64]
        Aggregate[_ => sum($0, overflow⇒[ERROR]):i64?]
          Read:Virtual[_ => "ssu2.order_count":i64?]

empty_union_branch_control:
  # The same count with no coalesce gives NULL over the empty branch.
  request:
    select: [order_count]
  expect:
    rows:
      - [order_count]
      - [null]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: sum

    === Plan
    Root[order_count]
      Aggregate[_ => sum($0, overflow⇒[ERROR]):i64?]
        Read:Virtual[_ => "ssu2.order_count":i64?]

no_matching_customer:
  # A re-aggregated count over a join that matches no customer coalesces to zero.
  request:
    select: [order_count]
  expect:
    rows:
      - [order_count]
      - [0]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_aggregate_generic
      @  2: extension:io.substrait:functions_comparison
      @  3: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: count
      #  2 @  2: equal
      #  3 @  3: sum
      #  4 @  2: coalesce

    === Plan
    Root[order_count]
      Project[coalesce($0, 0):i64]
        Aggregate[_ => sum($1, overflow⇒[ERROR]):i64?]
          Filter[equal($4, 'vip'):boolean? => $0, $1, $2, $3, $4]
            Join[&Inner, equal($0, $2):boolean? => $0, $1, $2, $3, $4]
              + Opt:Trace[semantic_source='orders_customers', source_role=&Joinset, cardinality=&ManyToOne]
              Aggregate[$1 => $1, count($2, overflow⇒[ERROR]):i64]
                Project[$3, $1, $0, $2]
                  Read:Virtual[
                    - (1, 1, 'EU', 100),
                    - (2, 1, 'EU', 50),
                    - (3, 2, 'EU', 70),
                    - (4, 3, 'US', 30),
                    - (5, 9, 'US', 20),
                    - (6, 2, null:string?, 40),
                    - (7, null:i64?, 'APAC', 10),
                    - (8, 4, 'US', 25)
                    - => order_id:i64?, cust_key:i64?, region_code:string?, amount:i64?]
              Project[$0, $2, $1]
                Read:Virtual[
                  - (1, 'SMB', 'EU'),
                  - (2, 'SMB', 'US'),
                  - (3, 'ENT', 'US'),
                  - (4, 'SMB', null:string?),
                  - (5, 'ENT', 'APAC')
                  - => customer_id:i64?, segment:string?, region:string?]

