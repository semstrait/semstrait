# Each join type delivers its matched and unmatched rows, and coalesces a name both operands map.

inner:
  # An Inner join gives only its matched rows, each Coalesce of a name both operands map.
  request:
    select: [order_id, region, segment]
  expect:
    rows:
      - [order_id, region, segment]
      - [1, EU, SMB]
      - [2, EU, SMB]
      - [3, EU, SMB]
      - [4, US, ENT]
      - [6, US, SMB]
      - [8, US, SMB]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: equal
      #  2 @  1: coalesce

    === Plan
    Root[order_id, region, segment]
      Project[$0, $1, $2]
        Project[$2, coalesce($3, $5):string?, $6]
          Join[&Inner, equal($1, $4):boolean? => $0, $1, $2, $3, $4, $5, $6]
            + Opt:Trace[semantic_source='orders_customers', source_role=&Joinset, cardinality=&ManyToOne]
            Project[$3, $1, $0, $2]
              Read:Virtual[
                - (1, 1, 'EU', 100),
                - (2, 1, 'EU', 50),
                - (3, 2, 'EU', 70),
                - (4, 3, 'US', 30),
                - (5, 9, 'US', 20),
                - (6, 2, null:string?, 40),
                - (7, null:i64?, 'APAC', 10),
                - (8, 4, 'US', 25)
                - => order_id:i64?, cust_key:i64?, region_code:string?, amount:i64?]
            Project[$0, $2, $1]
              Read:Virtual[
                - (1, 'SMB', 'EU'),
                - (2, 'SMB', 'US'),
                - (3, 'ENT', 'US'),
                - (4, 'SMB', null:string?),
                - (5, 'ENT', 'APAC')
                - => customer_id:i64?, segment:string?, region:string?]

