# A marker's NULLs sort last, so the latest non-null row wins or every row of a null group counts.

nulls_last_tie:
  # With NULLs last, the marker keeps the latest non-NULL by, or every row where by is NULL throughout.
  request:
    select: [g, v]
  expect:
    rows:
      - [g, v]
      - [a, 2]
      - [b, 9]
      - [null, 13]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
      @  2: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: rank
      #  2 @  1: sum
      #  3 @  2: equal

    === Plan
    Root[g, v]
      Project[$0, $1]
        Aggregate[$0 => $0, sum($2, overflow⇒[ERROR]):i64?]
          Project[$0, $1, $2, !{RexType}]
            Project[$0, $1, $2]
              Read[sales.f4 => g:string?, d:date?, v:i64?]
