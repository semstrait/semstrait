# A table reads by its namespace and name, with or without a named catalog.

no_catalog_table:
  # A table with no catalog entry is read by its namespace and name alone.
  model: models/reads
  request:
    select: [segment, n]
  types: [string, bigint]
  expect:
    rows:
      - [segment, n]
      - [SMB, 2]
      - [ENT, 1]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_aggregate_generic
    Functions:
      #  1 @  1: count

    === Plan
    Root[segment, n]
      Aggregate[$1 => $1, count($0, overflow⇒[ERROR]):i64]
        Project[$0, $1]
          Read[sales.customers => id:i64?, segment:string?]

catalog_named_table:
  # A table in a named catalog is read by its catalog, namespace and name.
  model: models/reads
  request:
    select: [segment, n]
  types: [string, bigint]
  expect:
    rows:
      - [segment, n]
      - [SMB, 2]
      - [ENT, 1]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_aggregate_generic
    Functions:
      #  1 @  1: count

    === Plan
    Root[segment, n]
      Aggregate[$1 => $1, count($0, overflow⇒[ERROR]):i64]
        Project[$0, $1]
          Read[lake.sales.customers => id:i64?, segment:string?]
