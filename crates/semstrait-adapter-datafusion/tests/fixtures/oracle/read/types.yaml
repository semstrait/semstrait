# A column's read type comes from its catalog, its declared semantics, or the widest of several.

catalog_string_cast:
  # max casts a catalog-reported string column to the declared integer type.
  model: models/commerce
  request:
    from: codes
    select: [top_code]
  expect:
    rows:
      - [top_code]
      - [10]
  sql: SELECT max(CAST(code AS INTEGER)) AS top_code FROM warehouse.codes
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: max

    === Plan
    Root[top_code]
      Aggregate[_ => max($0):i32?]
        + Opt:Trace[scope_root='codes', compositions=0, granularity_fit=&NotSelected]
        Project[($0)::!i32?]
          Read[warehouse.codes => code:string?]
            + Opt:Trace[semantic_source='codes', source_role=&Dataset, physical_source='codes']

object_string_read_type:
  # max reads a files object's string column at the read type that compile writes.
  model: models/commerce
  request:
    from: code_files
    select: [top_file_code]
  expect:
    rows:
      - [top_file_code]
      - [10]
  sql: SELECT max(CAST(code AS INTEGER)) AS top_file_code FROM code_files
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: max

    === Plan
