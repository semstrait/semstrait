# A path physical source's key=value folders give partition columns, read like any other column.

default_partition_null:
  # A year=__HIVE_DEFAULT_PARTITION__ folder gives one row with its partition key NULL.
  model: models/commerce_own_tables
  request:
    from: sales
    select: [order_year, total_amount]
  expect:
    rows:
      - [order_year, total_amount]
      - [2026, 25.5]
      - [null, 8.25]
  sql: SELECT year AS order_year, sum(amount) AS total_amount FROM sales GROUP BY year
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: sum

    === Plan
    Root[order_year, total_amount]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='sales', compositions=0, granularity_fit=&NotSelected]
        Project[($0)::!i32?, ($1)::!fp64?]
          Read[!{ReadRel} => year:i32?, amount:fp64?]
            + Opt:Trace[semantic_source='sales', source_role=&Dataset, physical_source='orders']

dt_key_bucketed_month:
  # A partition key is a column, so date_trunc can bucket it by month.
  model: models/commerce_own_formula
  request:
    from: sales
    select:
      - {dimension: event_date, granularity: month}
      - total_amount
  expect:
    rows:
      - [event_date, total_amount]
      - ['2026-01-01', 16.5]
      - ['2026-02-01', 9.5]
  sql: >-
    SELECT date_trunc('month', dt) AS event_date, sum(amount) AS total_amount
    FROM sales GROUP BY 1
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:semstrait:datafusion
      @  2: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: date_trunc
      #  2 @  2: sum

    === Plan
    Root[event_date, total_amount]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='sales', compositions=0, granularity_fit=&NotSelected]
        Project[(date_trunc('month', $0):date?)::!date?, $1]
          Project[($0)::!date?, ($1)::!fp64?]
            Read[!{ReadRel} => dt:date?, amount:fp64?]
              + Opt:Trace[semantic_source='sales', source_role=&Dataset, physical_source='orders']

file_own_year_column:
  # A Uris read discovers no partitions, so the partition key's name is read from the file's own column.
  model: models/commerce_own_union
  request:
    from: sales_file
    select: [file_year]
  expect:
    rows:
      - [file_year]
      - [1999]
  sql: SELECT year AS file_year FROM sales_file GROUP BY year
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Plan
    Root[file_year]
      Aggregate[$0 => $0]
        + Opt:Trace[scope_root='sales_file', compositions=0, granularity_fit=&NotSelected]
        Project[($0)::!i32?]
          Read[!{ReadRel} => year:i32?]
            + Opt:Trace[semantic_source='sales_file', source_role=&Dataset, physical_source='orders']

folder_value_wins:
  # A file's own column of the partition key's name is not read; the folder's value wins.
  model: models/commerce
  request:
    from: sales_folder_wins
    select: [order_year, total_amount]
  expect:
    rows:
      - [order_year, total_amount]
      - [2025, 12.5]
      - [2026, 24.5]
  sql: SELECT year AS order_year, sum(amount) AS total_amount FROM sales GROUP BY year
  plan: |
