predicate_on_key:
  # A predicate on a partition key placed before aggregation keeps only its own partition's rows.
  model: models/commerce_expr_form
  request:
    from: sales
    select: [order_year, total_amount]
    where: {eq: [order_year, 2026]}
  expect:
    rows:
      - [order_year, total_amount]
      - [2026, 26.5]
  sql: SELECT year AS order_year, sum(amount) AS total_amount FROM sales WHERE year = 2026 GROUP BY year
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: equal
      #  2 @  2: sum

    === Plan
    Root[order_year, total_amount]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='sales', compositions=0, granularity_fit=&NotSelected]
        Filter[equal($0, 2026:i32):boolean? => $0, $1]
          Project[($0)::!i32?, ($1)::!fp64?]
            Read[!{ReadRel} => year:i32?, amount:fp64?]
              + Opt:Trace[semantic_source='sales', source_role=&Dataset, physical_source='orders']

