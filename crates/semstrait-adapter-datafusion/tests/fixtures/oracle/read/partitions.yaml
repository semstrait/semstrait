            + Opt:Trace[semantic_source='sales_folder_wins', source_role=&Dataset, physical_source='orders']

folder_distinct_count:
  # Counting the distinct partition-key values counts the folders, not the files' own column.
  model: models/commerce
  request:
    from: sales_folder_wins
    select: [n_years]
  expect:
    rows:
      - [n_years]
      - [2]
  sql: SELECT count(DISTINCT year) AS n_years FROM sales
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_aggregate_generic
    Functions:
      #  1 @  1: count

    === Plan
    Root[n_years]
      Aggregate[_ => count($0, overflow⇒[ERROR]):i64]
        + Opt:Trace[scope_root='sales_folder_wins', compositions=0, granularity_fit=&NotSelected]
        Project[$0]
          Read[!{ReadRel} => year:i32?]
            + Opt:Trace[semantic_source='sales_folder_wins', source_role=&Dataset, physical_source='orders']

month_key_partitions:
  # Only the month key is mapped, and the request returns both partitions' rows.
  model: models/commerce_decimal_revenue
  request:
    from: sales
    select: [order_month, total_amount]
  expect:
    rows:
      - [order_month, total_amount]
      - [1, 24.5]
      - [2, 6.5]
