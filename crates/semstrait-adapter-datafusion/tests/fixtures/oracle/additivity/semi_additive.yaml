# A semi-additive Measure's strategy keeps the latest or earliest rows, by axes and by, and a Metric reads it at its marker.

latest_no_axes:
  # A semi-additive Measure with no axes keeps the latest date across every account.
  model: models/finance_balances
  request:
    from: balances
    select: [{dimension: date, granularity: month}, balance]
  expect:
    rows:
      - [date, balance]
      - [2026-10-01, 130]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:semstrait:datafusion
      @  2: extension:io.substrait:functions_arithmetic
      @  3: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: date_trunc
      #  2 @  2: rank
      #  3 @  2: sum
      #  4 @  3: equal

    === Plan
    Root[date, balance]
      Aggregate[$3 => $3, sum($0, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='balances', compositions=0, granularity_fit=&Requested, granularity=&Day]
        Project[$0, !{RexType}, $1, $2]
          Project[$0, $1, (date_trunc('month', $1):date?)::!date?]
            Project[$1, $0]
              Read[warehouse.balances => date:date?, balance:i64?]
                + Opt:Trace[semantic_source='balances', source_role=&Dataset, physical_source='balances']

