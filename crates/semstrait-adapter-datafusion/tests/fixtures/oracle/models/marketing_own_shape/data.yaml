    name: snap_raw
    columns:
      - {name: campaign_id, type: string}
      - {name: ts, type: timestamp}
      - {name: balance, type: bigint}
    rows:
      - [A, "2026-03-10 08:00:00", 100]
      - [A, "2026-03-10 20:00:00", 80]
      - [A, "2026-03-11 09:00:00", 70]
  - namespace: warehouse
    name: snap_daily
    columns:
      - {name: campaign_id, type: string}
      - {name: ts, type: timestamp}
