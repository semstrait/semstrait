# A Unionset whose second branch maps no campaign, so it NULL-fills that name; its named filters read campaign.
semantic_model:
  name: unionset_null_fill
  dimensions:
    - name: date
      data_type: date
      type:
        temporal:
          granularities: [day]
    - {name: campaign, data_type: string, type: categorical}
  measures:
    - {name: clicks, data_type: bigint, agg: sum}
  unionsets:
    - name: ads
      mode: all
      dimensions: [{ref: date}, {ref: campaign}]
      measures: [{ref: clicks}]
      filters:
        - name: brand_only
          expr: {eq: [campaign, {lit: brand}]}
        - name: unattributed
          expr: {is_null: campaign}
        - name: not_brand
          expr: {not: {eq: [campaign, {lit: brand}]}}
        - name: brand_or_late
          expr:
            or:
              - {eq: [campaign, {lit: brand}]}
              - {gt: [date, {lit: '2024-01-15'}]}
      datasets:
        - name: facebook
          extras:
            storage: {tables: [warehouse.facebook]}
            semantic_mapping: {date: date, campaign: campaign, clicks: clicks}
            temporal: {timeseries: {occurred_at: date}, granularity: day}
        - name: tiktok
          extras:
            storage: {tables: [warehouse.tiktok]}
            semantic_mapping: {date: date, clicks: clicks}
            temporal: {timeseries: {occurred_at: date}, granularity: day}
