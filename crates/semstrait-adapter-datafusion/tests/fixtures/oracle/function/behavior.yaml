# A canonical function's behaviour on a NULL operand, a cast, or a pattern match.

concat_null_operand:
  # concat gives NULL when one of its operands is NULL.
  model: models/commerce
  request:
    from: rows
    select: [c]
  expect:
    rows:
      - [c]
      - [US-purchase]
      - [null]
  sql: SELECT DISTINCT a || '-' || b AS c FROM warehouse.rows
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:io.substrait:functions_boolean
      @  3: extension:io.substrait:functions_string
    Functions:
      #  1 @  1: is_null
      #  2 @  2: or
      #  3 @  2: not
      #  4 @  3: concat

    === Plan
    Root[c]
      Aggregate[$0 => $0]
        + Opt:Trace[scope_root='rows', compositions=0, granularity_fit=&NotSelected]
        Project[if_then(not(or(or(is_null($0):boolean, is_null('-'):boolean):boolean, is_null($1):boolean):boolean):boolean -> concat($0, '-', $1, null_handling⇒[IGNORE_NULLS]):string, _ -> !{Expression})]
          Read[warehouse.rows => a:string?, b:string?]
            + Opt:Trace[semantic_source='rows', source_role=&Dataset, physical_source='rows']

concat_two_columns:
  # country_type joins two columns with a literal separator.
  model: models/finance
  request:
    from: transactions
    select: [country_type]
  input_data:
    warehouse.transactions:
      - [null, null, null, null, US, purchase]
  expect:
