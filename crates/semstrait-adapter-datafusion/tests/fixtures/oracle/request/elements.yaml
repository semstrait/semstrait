limit_and_offset:
  # A row window with an order, a limit and an offset skips rows before the limit.
  model: models/commerce
  request:
    from: orders_skeleton
    select: [region, revenue]
    order_by: [{name: revenue, direction: desc}]
    limit: 1
    offset: 1
  expect:
    rows:
      - [region, revenue]
      - [eu, 150.0]
  sql: SELECT region, sum(amount) AS revenue FROM warehouse.orders GROUP BY region ORDER BY revenue DESC LIMIT 1 OFFSET 1
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: sum

    === Plan
    Root[region, revenue]
      Fetch[limit=1, offset=1 => $0, $1]
        + Opt:Trace[scope_root='orders_skeleton', compositions=0, granularity_fit=&NotSelected]
        Sort[($1, &DescNullsFirst) => $0, $1]
          Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
            Project[$0, $1]
              Read[warehouse.orders => region:string?, amount:fp64?]
                + Opt:Trace[semantic_source='orders_skeleton', source_role=&Dataset, physical_source='orders']

offset_no_limit:
