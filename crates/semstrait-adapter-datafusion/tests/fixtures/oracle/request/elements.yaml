# The request's own mechanics over one Dataset: selection, filters, where, order, limit and offset.

aggregate_filter_mirror:
  # A Metric's own filter clause keeps its own rows beside the plain aggregate it sits next to.
  model: models/commerce
  request:
    from: orders_skeleton
    select: [region, web_revenue, revenue]
  expect:
    rows:
      - [region, web_revenue, revenue]
      - [eu, 100.0, 150.0]
      - [us, 200.0, 210.0]
  sql: >-
    SELECT region, sum(amount) FILTER (WHERE channel = 'web') AS web_revenue,
    sum(amount) AS revenue FROM warehouse.orders GROUP BY region
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: equal
      #  2 @  2: sum

    === Plan
    Root[region, web_revenue, revenue]
      Aggregate[$0 => $0, sum($2, overflow⇒[ERROR]):fp64?, sum($1, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='orders_skeleton', compositions=0, granularity_fit=&NotSelected]
        Project[$0, $1, $1, equal($2, 'web'):boolean?]
          Read[warehouse.orders => region:string?, amount:fp64?, channel:string?]
            + Opt:Trace[semantic_source='orders_skeleton', source_role=&Dataset, physical_source='orders']

named_filter:
  # A named filter, followed through its link, keeps only the rows its linked condition allows.
  model: models/commerce
  request:
    from: orders_skeleton
    select: [region, channel, revenue]
    filters: [eu_web]
  expect:
    rows:
      - [region, channel, revenue]
      - [eu, web, 100.0]
  sql: SELECT region, channel, sum(amount) AS revenue FROM warehouse.orders WHERE region = 'eu' AND channel = 'web' GROUP BY region, channel
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:io.substrait:functions_boolean
      @  3: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: equal
      #  2 @  2: and
      #  3 @  3: sum

    === Plan
    Root[region, channel, revenue]
      Aggregate[$2, $0 => $2, $0, sum($3, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='orders_skeleton', compositions=0, granularity_fit=&NotSelected]
        Filter[$1 => $0, $1, $2, $3]
          Project[$1, and(equal($0, 'eu'):boolean?, equal($1, 'web'):boolean?):boolean?, $0, $2]
            Read[warehouse.orders => region:string?, channel:string?, amount:fp64?]
              + Opt:Trace[semantic_source='orders_skeleton', source_role=&Dataset, physical_source='orders']

