# A Grainset with one child and a Unionset of mode all with one branch are Sugar: compile stores the child under the composition's name.

grainset_answers_as_a_dataset:
  # A one-child Grainset answers as its only child, which the trace names by the Grainset's name.
  model: models/one_child_grainset
  request:
    from: ads
    select: [reach]
  expect:
    rows:
      - [reach]
      - [3]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: sum

    === Plan
    Root[reach]
      Aggregate[_ => sum($0, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='ads', compositions=0, granularity_fit=&NotSelected, granularity=&Day]
        Project[$0]
          Read[warehouse.daily => reach:i64?]
            + Opt:Trace[semantic_source='ads', source_role=&Dataset, physical_source='daily']

grainset_keeps_its_child_granularity:
  # A one-child Grainset that states a time axis and no granularity keeps the child's Day.
  model: models/one_child_grainset
  request:
    from: ads_stated
    select: [{dimension: date, granularity: day}, reach]
  expect:
    rows:
      - [date, reach]
      - [2024-01-01, 1]
      - [2024-01-02, 2]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:semstrait:datafusion
      @  2: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: date_trunc
      #  2 @  2: sum

    === Plan
    Root[date, reach]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='ads_stated', compositions=0, granularity_fit=&Requested, granularity=&Day]
        Project[(date_trunc('day', $0):date?)::!date?, $1]
          Project[$0, $1]
            Read[warehouse.daily => date:date?, reach:i64?]
              + Opt:Trace[semantic_source='ads_stated', source_role=&Dataset, physical_source='daily']

grainset_nested_in_a_unionset:
  # A one-child Grainset inside a Unionset is one of its branches, named under the Unionset.
  model: models/one_child_nested
  request:
    from: ads
    select: [campaign, clicks]
  expect:
    rows:
      - [campaign, clicks]
      - [spring, 12]
      - [search, 6]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: sum

    === Plan
    Root[campaign, clicks]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='ads', compositions=1, granularity_fit=&NotSelected, granularity=&Day]
        Project[$0, $1]
          Set[&UnionAll => $0, $1]
            + Opt:Trace[semantic_source='ads', source_role=&Unionset, delivery=&PartialAggregates]
            Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
              Project[$0, $2, $1]
                Project[$0, true, $1]
                  Read[warehouse.google_by_campaign => campaign:string?, clicks:i64?]
                    + Opt:Trace[semantic_source='ads.google', source_role=&Dataset, originators=('ads',), physical_source='google_by_campaign']
            Project[$0, $1]
              Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
                Project[$0, $2, $1]
                  Project[$0, true, $1]
                    Read[warehouse.other => campaign:string?, clicks:i64?]
                      + Opt:Trace[semantic_source='ads.other', source_role=&Dataset, originators=('ads',), physical_source='other']

