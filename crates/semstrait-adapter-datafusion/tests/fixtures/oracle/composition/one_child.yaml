unionset_stating_month_over_a_day_child_keeps_the_day_child:
  # A one-branch Unionset that states month over its daily Dataset is stored as the daily Dataset, so a month request rolls its days up.
  model: models/one_child_month_over_day
  request:
    from: one
    select: [{dimension: date, granularity: month}, bal]
  expect:
    rows:
      - [date, bal]
      - [2024-01-01, 150]
      - [2024-02-01, 40]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:semstrait:datafusion
      @  2: extension:io.substrait:functions_arithmetic
      @  3: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: date_trunc
      #  2 @  2: rank
      #  3 @  2: sum
      #  4 @  3: equal

    === Plan
    Root[date, bal]
      Aggregate[$3 => $3, sum($0, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='one', compositions=1, granularity_fit=&Requested, granularity=&Day]
        + Opt:Trace[semantic_source='one', source_role=&Grainset, answered_by='one.inner']
        Project[$0, !{RexType}, $1, $2]
          Project[$0, $1, (date_trunc('month', $1):date?)::!date?]
            Project[$1, $0]
              Read[warehouse.daily => date:date?, bal:i64?]
                + Opt:Trace[semantic_source='one.inner', source_role=&Dataset, originators=('one',), physical_source='daily']

unionset_stating_day_over_a_month_child_keeps_the_month_child:
