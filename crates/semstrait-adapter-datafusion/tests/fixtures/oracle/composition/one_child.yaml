case_5_total_clicks_rolls_up_without_the_overlap:
  # A one-child Grainset over a Unionset stays under a Unionset, because the Unionset cannot hold the Unionset below it.
  model: models/one_child_sibling
  request:
    from: sources
    select: [clicks]
  expect:
    rows:
      - [clicks]
      - [10500]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: sum

    === Plan
    Root[clicks]
      Project[($0)::!i64?]
        + Opt:Trace[scope_root='sources', compositions=4, granularity_fit=&NotSelected]
        Aggregate[_ => sum($0, overflow⇒[ERROR]):i64?]
          Project[$0]
            Set[&UnionAll => $0]
              + Opt:Trace[semantic_source='sources', source_role=&Unionset, delivery=&PartialAggregates]
              Aggregate[_ => sum($0, overflow⇒[ERROR]):i64?]
                Project[$1, $0]
                  Project[true, $0]
                    + Opt:Trace[semantic_source='sources.adwords', source_role=&Grainset, originators=('sources',), answered_by='sources.adwords.rt1']
                    Read[warehouse.rt1 => clicks:i64?]
                      + Opt:Trace[semantic_source='sources.adwords.rt1', source_role=&Dataset, originators=('sources.adwords',), physical_source='rt1']
              Project[$0]
                Aggregate[_ => sum($0, overflow⇒[ERROR]):i64?]
                  + Opt:Trace[semantic_source='sources.tiktok', source_role=&Grainset, originators=('sources',), answered_by='sources.tiktok.tiktok_disjoint_1']
                  Project[$0]
                    Set[&UnionAll => $0]
                      + Opt:Trace[semantic_source='sources.tiktok.tiktok_disjoint_1', source_role=&Unionset, originators=('sources.tiktok',), delivery=&PartialAggregates]
                      Aggregate[_ => sum($0, overflow⇒[ERROR]):i64?]
                        Project[$1, $0]
                          Project[true, $0]
                            Read[warehouse.rt3 => clicks:i64?]
                              + Opt:Trace[semantic_source='sources.tiktok.tiktok_disjoint_1.rt3', source_role=&Dataset, originators=('sources.tiktok.tiktok_disjoint_1',), physical_source='rt3']
                      Project[$0]
                        Aggregate[_ => sum($0, overflow⇒[ERROR]):i64?]
                          Project[$1, $0]
                            Project[true, $0]
                              Read[warehouse.rt4 => clicks:i64?]
                                + Opt:Trace[semantic_source='sources.tiktok.tiktok_disjoint_1.rt4', source_role=&Dataset, originators=('sources.tiktok.tiktok_disjoint_1',), physical_source='rt4']

