# A built join takes a composed Unionset's rows or its partial aggregates, by what the parent demands.

nonadditive_takes_rows:
  # A non-additive Measure above a built join takes the Unionset's rows, though a column separates its branches.
  model: models/marketing
  request:
    from: campaigns_spend_all
    select: [channel, campaign_name, avg_cost]
  expect:
    rows:
      - [channel, campaign_name, avg_cost]
      - [web, Summer, 30.0]
      - [app, Summer, 40.0]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: equal
      #  2 @  2: avg

    === Plan
    Root[channel, campaign_name, avg_cost]
      Aggregate[$3, $2 => $3, $2, avg($0, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='campaigns_spend_all', compositions=2, granularity_fit=&NotSelected]
        Project[$3, $2, $0, $5]
          Join[&Inner, equal($1, $4):boolean? => $0, $1, $2, $3, $4, $5]
            + Opt:Trace[semantic_source='campaigns_spend_all', source_role=&Joinset, cardinality=&OneToMany]
            Aggregate[$1, $0 => $1, $0]
              Project[$1, $0]
                Read[warehouse.campaigns => campaign_name:string?, campaign_id:string?]
                  + Opt:Trace[semantic_source='campaigns_spend_all.campaigns', source_role=&Dataset, originators=('campaigns_spend_all',), physical_source='campaigns']
            Project[$0, $1, $2, $3]
              Set[&UnionAll => $0, $1, $2, $3]
                + Opt:Trace[semantic_source='campaigns_spend_all.spend_all', source_role=&Unionset, originators=('campaigns_spend_all',), delivery=&Rows]
                Project[true, ($0)::!fp64?, $1, 'app']
                  Read[warehouse.spend_app => cost:i64?, campaign_id:string?]
                    + Opt:Trace[semantic_source='campaigns_spend_all.spend_all.app', source_role=&Dataset, originators=('campaigns_spend_all.spend_all',), physical_source='spend_app']
                Project[true, ($0)::!fp64?, $1, 'web']
                  Read[warehouse.spend_web => cost:i64?, campaign_id:string?]
                    + Opt:Trace[semantic_source='campaigns_spend_all.spend_all.web', source_role=&Dataset, originators=('campaigns_spend_all.spend_all',), physical_source='spend_web']

partial_aggregates_one_per_key:
  # A built join takes partial aggregates grouped by the join key alone, so each key's value counts once.
  model: models/marketing
  request:
    from: campaigns_spend_all
    select: [campaign_name, budget, cost]
  expect:
    rows:
      - [campaign_name, budget, cost]
      - [Summer, 300, 130]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
      @  2: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: sum
      #  2 @  2: equal

    === Plan
    Root[campaign_name, budget, cost]
      Aggregate[$1 => $1, sum($0, overflow⇒[ERROR]):i64?, sum($2, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='campaigns_spend_all', compositions=2, granularity_fit=&NotSelected]
        Project[$2, $0, $4]
          Join[&Inner, equal($1, $3):boolean? => $0, $1, $2, $3, $4]
            + Opt:Trace[semantic_source='campaigns_spend_all', source_role=&Joinset, cardinality=&OneToMany]
            Aggregate[$2, $1 => $2, $1, sum($0, overflow⇒[ERROR]):i64?]
              Project[$1, $2, $0]
                Read[warehouse.campaigns => campaign_name:string?, budget:i64?, campaign_id:string?]
                  + Opt:Trace[semantic_source='campaigns_spend_all.campaigns', source_role=&Dataset, originators=('campaigns_spend_all',), physical_source='campaigns']
            Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
              Project[$0, $1]
                Set[&UnionAll => $0, $1]
                  + Opt:Trace[semantic_source='campaigns_spend_all.spend_all', source_role=&Unionset, originators=('campaigns_spend_all',), delivery=&PartialAggregates]
                  Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
                    Project[$0, $2, $1]
                      Project[$1, true, $0]
                        Read[warehouse.spend_app => cost:i64?, campaign_id:string?]
                          + Opt:Trace[semantic_source='campaigns_spend_all.spend_all.app', source_role=&Dataset, originators=('campaigns_spend_all.spend_all',), physical_source='spend_app']
                  Project[$0, $1]
                    Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
                      Project[$0, $2, $1]
                        Project[$1, true, $0]
                          Read[warehouse.spend_web => cost:i64?, campaign_id:string?]
                            + Opt:Trace[semantic_source='campaigns_spend_all.spend_all.web', source_role=&Dataset, originators=('campaigns_spend_all.spend_all',), physical_source='spend_web']
