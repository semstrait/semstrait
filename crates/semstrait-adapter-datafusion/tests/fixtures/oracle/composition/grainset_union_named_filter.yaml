# A named filter on a Grainset goes to a Unionset child that answers alone, into each of its branches.

web_at_month:
  # The Month Unionset child answers alone and the filter goes into each of its branches.
  model: models/sales_union_named_filter
  request:
    from: sales
    select: [{dimension: ordered_at, granularity: month}, revenue]
    filters: [web]
  expect:
    rows:
      - [ordered_at, revenue]
      - [2026-09-01, 40]
      - [2026-10-01, 150]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:io.substrait:functions_arithmetic
      @  3: extension:semstrait:datafusion
    Functions:
      #  1 @  1: equal
      #  2 @  2: sum
      #  3 @  3: date_trunc

    === Plan
    Root[ordered_at, revenue]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='sales', compositions=2, granularity_fit=&Requested, granularity=&Month]
        + Opt:Trace[semantic_source='sales', source_role=&Grainset, answered_by='sales.u']
        Project[(date_trunc('month', $0):date?)::!date?, $1]
          Project[$0, $1]
            Set[&UnionAll => $0, $1]
              + Opt:Trace[semantic_source='sales.u', source_role=&Unionset, originators=('sales',), delivery=&PartialAggregates]
              Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
                Project[$1, $3, $2]
                  Project[$0, $1, $2, $3]
                    Filter[$4 => $0, $1, $2, $3, $4]
                      Project[$2, $0, true, $1, equal($2, 'web'):boolean?]
                        Read[warehouse.east => month_start:date?, amount:i64?, channel:string?]
                          + Opt:Trace[semantic_source='sales.u.east', source_role=&Dataset, originators=('sales.u',), physical_source='east']
              Project[$0, $1]
                Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
                  Project[$1, $3, $2]
                    Project[$0, $1, $2, $3]
                      Filter[$4 => $0, $1, $2, $3, $4]
                        Project[$2, $0, true, $1, equal($2, 'web'):boolean?]
                          Read[warehouse.west => month_start:date?, amount:i64?, channel:string?]
                            + Opt:Trace[semantic_source='sales.u.west', source_role=&Dataset, originators=('sales.u',), physical_source='west']
