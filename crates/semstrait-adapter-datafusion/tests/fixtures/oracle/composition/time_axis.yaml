kept_operand_marker_in_join:
  # Keeping the sibling operand puts the marker in the join's own frame, reading the Unionset.
  model: models/finance
  request:
    from: j
    select: [{dimension: date, granularity: month}, region, balance]
  expect:
    rows:
      - [date, region, balance]
