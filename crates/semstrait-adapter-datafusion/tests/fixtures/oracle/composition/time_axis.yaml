# A nested composition's own marker, grain or literal fold reaches through its constituents to re-aggregate.

root_grainset_to_union_child:
  # A root Grainset routes to its composed Unionset child, which carries Month but holds day values.
  model: models/finance
  request:
    from: gbal2
    select: [{dimension: date, granularity: month}, account, balance]
  expect:
    rows:
      - [date, account, balance]
      - [2026-10-01, X, 130]
      - [2026-10-01, Y, 210]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
      @  2: extension:semstrait:datafusion
      @  3: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: sum
      #  2 @  2: date_trunc
      #  3 @  1: rank
      #  4 @  3: equal

    === Plan
    Root[date, account, balance]
      Aggregate[$4, $0 => $4, $0, sum($1, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='gbal2', compositions=2, granularity_fit=&Requested, granularity=&Month]
        + Opt:Trace[semantic_source='gbal2', source_role=&Grainset, answered_by='gbal2.u_bal']
        Project[$0, $1, !{RexType}, $2, $3]
          Project[$0, $1, $2, (date_trunc('month', $2):date?)::!date?]
            Project[$1, $2, $0]
              Set[&UnionAll => $0, $1, $2]
                + Opt:Trace[semantic_source='gbal2.u_bal', source_role=&Unionset, originators=('gbal2',), delivery=&PartialAggregates]
                Aggregate[$3, $0 => $3, $0, sum($1, overflow⇒[ERROR]):i64?]
                  Project[$0, $2, $1, $3]
                    Project[$1, true, $2, $0]
                      Read[warehouse.bal_eu => date:date?, account:string?, balance:i64?]
                        + Opt:Trace[semantic_source='gbal2.u_bal.bal_eu', source_role=&Dataset, originators=('gbal2.u_bal',), physical_source='bal_eu']
                Project[$0, $1, $2]
                  Aggregate[$3, $0 => $3, $0, sum($1, overflow⇒[ERROR]):i64?]
                    Project[$0, $2, $1, $3]
                      Project[$1, true, $2, $0]
                        Read[warehouse.bal_us => date:date?, account:string?, balance:i64?]
                          + Opt:Trace[semantic_source='gbal2.u_bal.bal_us', source_role=&Dataset, originators=('gbal2.u_bal',), physical_source='bal_us']

