    Root[date, region, balance]
      Aggregate[$3, $4 => $3, $4, sum($0, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='j', compositions=2, granularity_fit=&Requested, granularity=&Month]
        Project[$0, !{RexType}, $1, $2, $3]
