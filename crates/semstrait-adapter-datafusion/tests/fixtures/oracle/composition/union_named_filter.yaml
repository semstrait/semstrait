# A named filter on a Unionset goes into a Grainset branch, which passes it to the child that answers alone.

web_at_month:
  # The Grainset branch answers at Month from its Month child and the dataset branch is filtered beside it.
  model: models/sales_named_filter
  request:
    from: all_sales
    select: [{dimension: ordered_at, granularity: month}, revenue]
    filters: [web]
  expect:
    rows:
      - [ordered_at, revenue]
      - [2026-09-01, 40]
      - [2026-10-01, 155]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:io.substrait:functions_arithmetic
      @  3: extension:semstrait:datafusion
    Functions:
      #  1 @  1: equal
      #  2 @  2: sum
      #  3 @  3: date_trunc

    === Plan
    Root[ordered_at, revenue]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='all_sales', compositions=2, granularity_fit=&Requested]
        Project[(date_trunc('month', $0):date?)::!date?, $1]
          Project[$0, $1]
            Set[&UnionAll => $0, $1]
              + Opt:Trace[semantic_source='all_sales', source_role=&Unionset, delivery=&PartialAggregates]
              Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
                Project[$1, $3, $2]
                  Project[$0, $1, $2, $3]
                    + Opt:Trace[semantic_source='all_sales.sales', source_role=&Grainset, originators=('all_sales',), answered_by='all_sales.sales.m']
                    Filter[$4 => $0, $1, $2, $3, $4]
                      Project[$2, $0, true, $1, equal($2, 'web'):boolean?]
                        Read[warehouse.m => month_start:date?, amount:i64?, channel:string?]
                          + Opt:Trace[semantic_source='all_sales.sales.m', source_role=&Dataset, originators=('all_sales.sales',), physical_source='m']
              Project[$0, $1]
                Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
                  Project[$1, $3, $2]
                    Project[$0, $1, $2, $3]
                      Filter[$4 => $0, $1, $2, $3, $4]
                        Project[$2, $0, true, $1, equal($2, 'web'):boolean?]
                          Read[warehouse.x => day:date?, amount:i64?, channel:string?]
                            + Opt:Trace[semantic_source='all_sales.x', source_role=&Dataset, originators=('all_sales',), physical_source='x']
