  # Under campaign IS NULL, web's NULL campaign has cost 9 in cost_by_campaign and impressions 36 in clicks_by_campaign, and users_by_gender holds no row of it. campaign_cpi_avg's read of the union again at (channel, campaign) drills across those children, and the frame's own read takes users from the same drill-across, so it holds web, and the subtree's left join onto it keeps the row: users is NULL beside 9 / 36 = 0.25. A read of users from users_by_gender alone holds no web group, and the join would drop the row.
