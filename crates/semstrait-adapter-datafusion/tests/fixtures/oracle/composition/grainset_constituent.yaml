disjoint_branch_reads_the_union_again_at_the_part_key_for_a_parts_metric:
  # gender_cost_per_user_or_click is a Metric with no own aggregation, and its part key reads gender, which the demand does not group by, so its step 1 groups by (channel, campaign) and the key. The Grainset branch serves cost and users only by a drill-across, so the subtree reads the union again at (channel, campaign) and the key, where the branches are disjoint and give final aggregates: each branch computes the key on its own rows, and step 1 reads each aggregate as a field (ADR 0074 *One form for every read*, *The parts*). by_gender gives cost and clicks and users_by_gender users per key: web A sums f's 10 / 2 = 5 and the other genders' 20 / 5 = 4 to 9, web B is 7 / 1 = 7, and ads_store's NULL gender falls in the part that divides by clicks, so its A is 1 / 2 = 0.5.
  model: models/marketing_all_spend
  request:
    from: ads_by_channel
    select: [channel, campaign, gender_cost_per_user_or_click]
  expect:
    rows:
      - [channel, campaign, gender_cost_per_user_or_click]
      - [web, A, 9.0]
      - [web, B, 7.0]
      - [store, A, 0.5]
  sql: SELECT channel, campaign, sum(CASE WHEN k = 1 THEN CAST(cost AS DOUBLE) / NULLIF(users, 0) ELSE CAST(cost AS DOUBLE) / NULLIF(clicks, 0) END) AS gender_cost_per_user_or_click FROM (SELECT 'web' AS channel, coalesce(c.campaign, u.campaign) AS campaign, coalesce(c.k, u.k) AS k, c.cost, c.clicks, u.users FROM (SELECT campaign, CASE WHEN gender = 'f' THEN 1 ELSE 2 END AS k, sum(cost) AS cost, sum(clicks) AS clicks FROM warehouse.ads_by_gender GROUP BY ALL) c FULL JOIN (SELECT campaign, CASE WHEN gender = 'f' THEN 1 ELSE 2 END AS k, count(DISTINCT user_id) AS users FROM warehouse.ads_users GROUP BY ALL) u ON c.campaign IS NOT DISTINCT FROM u.campaign AND c.k = u.k UNION ALL SELECT 'store', campaign, 2, sum(cost), sum(clicks), CAST(NULL AS BIGINT) FROM warehouse.ads_store GROUP BY campaign) b GROUP BY channel, campaign
