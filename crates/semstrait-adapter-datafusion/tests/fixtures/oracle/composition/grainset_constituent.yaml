      @  2: extension:io.substrait:functions_comparison
      @  3: extension:io.substrait:functions_boolean
    Functions:
      #  1 @  1: sum
      #  2 @  2: is_not_distinct_from
      #  3 @  3: and
      #  4 @  2: coalesce
      #  5 @  1: divide
      #  6 @  1: avg

    === Plan
    Root[channel, campaign, avg_cpi]
      Aggregate[$2, $1 => $2, $1, avg($0, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='ads_by_channel', compositions=2, granularity_fit=&NotSelected]
        Project[divide(($2)::!fp64?, (($3)::!i64?)::!fp64?, on_division_by_zero⇒[ERROR]):fp64?, $1, $0]
          Set[&UnionAll => $0, $1, $2, $3]
            + Opt:Trace[semantic_source='ads_by_channel', source_role=&Unionset, delivery=&FinalAggregates]
            Project[$0, $1, $5, $4]
              Project[$1, $0, $3, $5, $4, $2]
