# A Grainset used as a Unionset or Joinset constituent answers within its own mask, NULL-filling what it does not map.

constituent_answers_no_drill:
  # One child that serves both requested names alone answers the Grainset constituent, with no drill-across.
  model: models/marketing_all_spend
  request:
    from: all_spend3
    select: [{dimension: date, granularity: month}, budget]
  expect:
    rows:
      - [date, budget]
      - [2026-03-01, 150]
      - [2026-04-01, 200]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
      @  2: extension:semstrait:datafusion
    Functions:
      #  1 @  1: sum
      #  2 @  2: date_trunc

    === Plan
    Root[date, budget]
      Aggregate[$1 => $1, sum($0, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='all_spend3', compositions=2, granularity_fit=&Requested]
        Project[$0, (date_trunc('month', $1):date?)::!date?]
          Project[$1, $0]
            Set[&UnionAll => $0, $1]
              + Opt:Trace[semantic_source='all_spend3', source_role=&Unionset, delivery=&PartialAggregates]
              Aggregate[$2 => $2, sum($0, overflow⇒[ERROR]):i64?]
                Project[$1, $0, $2]
                  Project[true, $1, $0]
                    Read[warehouse.spend_c3 => day:date?, budget:i64?]
                      + Opt:Trace[semantic_source='all_spend3.spend_c3', source_role=&Dataset, originators=('all_spend3',), physical_source='spend_c3']
              Project[$0, $1]
                Aggregate[$2 => $2, sum($0, overflow⇒[ERROR]):i64?]
                  Project[$1, $0, $2]
                    Project[true, $1, $0]
                      + Opt:Trace[semantic_source='all_spend3.spend_g3', source_role=&Grainset, originators=('all_spend3',), answered_by='all_spend3.spend_g3.g3_monthly']
                      Read[warehouse.g3_monthly => month_start:date?, budget:i64?]
                        + Opt:Trace[semantic_source='all_spend3.spend_g3.g3_monthly', source_role=&Dataset, originators=('all_spend3.spend_g3',), physical_source='g3_monthly']

disjoint_branch_own_drill:
  # A disjoint Unionset branch that is itself a Grainset drills across its own children, with no aggregate above the union.
  model: models/marketing_all_spend
  request:
    from: spend_by_channel
    select: [{dimension: date, granularity: month}, channel, clicks, budget]
  expect:
    rows:
      - [date, channel, clicks, budget]
      - [2026-03-01, web, 9, 100]
      - [2026-04-01, web, 3, 80]
      - [2026-03-01, store, 2, 10]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:semstrait:datafusion
      @  2: extension:io.substrait:functions_arithmetic
      @  3: extension:io.substrait:functions_comparison
      @  4: extension:io.substrait:functions_boolean
    Functions:
      #  1 @  1: date_trunc
      #  2 @  2: sum
      #  3 @  3: is_not_distinct_from
      #  4 @  4: and
      #  5 @  3: coalesce

    === Plan
    Root[date, channel, clicks, budget]
      Set[&UnionAll => $0, $1, $2, $3]
        + Opt:Trace[scope_root='spend_by_channel', compositions=2, granularity_fit=&Requested]
        + Opt:Trace[semantic_source='spend_by_channel', source_role=&Unionset, delivery=&FinalAggregates]
        Aggregate[$5, $2 => $5, $2, sum($3, overflow⇒[ERROR]):i64?, sum($0, overflow⇒[ERROR]):i64?]
          Project[$0, $1, $2, $3, $4, (date_trunc('month', $5):date?)::!date?]
            Project[$1, $0, $2, $4, $3, $5]
              Project[true, $2, 'store', true, $1, $0]
                Read[warehouse.spend_store => day:date?, clicks:i64?, budget:i64?]
                  + Opt:Trace[semantic_source='spend_by_channel.spend_store', source_role=&Dataset, originators=('spend_by_channel',), physical_source='spend_store']
        Project[$3, $1, $2, $0]
          Project[$0, coalesce($1, $3):string?, $4, coalesce($2, $5):date?]
            Join[&Outer, and(is_not_distinct_from($2, $5):boolean, is_not_distinct_from($1, $3):boolean):boolean => $0, $1, $2, $3, $4, $5]
              + Opt:Trace[semantic_source='spend_by_channel.spend_web', source_role=&Grainset, originators=('spend_by_channel',), cardinality=&OneToOne]
              Project[$2, $1, $0]
                Aggregate[$2, $1 => $2, $1, sum($0, overflow⇒[ERROR]):i64?]
                  Project[$0, $1, (date_trunc('month', $2):date?)::!date?]
                    Project[$1, 'web', $0]
                      Read[warehouse.web_monthly => month_start:date?, budget:i64?]
                        + Opt:Trace[semantic_source='spend_by_channel.spend_web.web_monthly', source_role=&Dataset, originators=('spend_by_channel.spend_web',), physical_source='web_monthly']
              Project[$1, $2, $0]
                Aggregate[$2, $0 => $2, $0, sum($1, overflow⇒[ERROR]):i64?]
                  Project[$0, $1, (date_trunc('month', $2):date?)::!date?]
                    Project['web', $1, $0]
                      Read[warehouse.web_daily => day:date?, clicks:i64?]
                        + Opt:Trace[semantic_source='spend_by_channel.spend_web.web_daily', source_role=&Dataset, originators=('spend_by_channel.spend_web',), physical_source='web_daily']

disjoint_branch_each_name_from_its_rank_first_child_through_the_full_join:
  # A disjoint Grainset branch takes each name from its rank-first child, and its Full join keeps every campaign, the NULL one once with each child's value.
  model: models/marketing_all_spend
  request:
    from: ads_by_channel
    select: [channel, campaign, cost, clicks]
  expect:
    rows:
      - [channel, campaign, cost, clicks]
      - [web, A, 40, 20]
      - [web, B, null, 3]
      - [web, C, 15, null]
      - [web, null, 9, 4]
      - [store, A, 1, 2]
  sql: SELECT 'web' AS channel, g.* FROM (SELECT coalesce(k.campaign, c.campaign) AS campaign, c.cost, k.clicks FROM (SELECT campaign, sum(clicks) AS clicks FROM warehouse.ads_clicks GROUP BY campaign) k FULL JOIN (SELECT campaign, sum(cost) AS cost FROM warehouse.ads_cost GROUP BY campaign) c ON k.campaign IS NOT DISTINCT FROM c.campaign) g UNION ALL SELECT 'store', campaign, sum(cost), sum(clicks) FROM warehouse.ads_store GROUP BY campaign
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
      @  2: extension:io.substrait:functions_comparison
      @  3: extension:io.substrait:functions_boolean
    Functions:
      #  1 @  1: sum
      #  2 @  2: is_not_distinct_from
      #  3 @  3: and
      #  4 @  2: coalesce

    === Plan
    Root[channel, campaign, cost, clicks]
      Set[&UnionAll => $0, $1, $2, $3]
        + Opt:Trace[scope_root='ads_by_channel', compositions=2, granularity_fit=&NotSelected]
        + Opt:Trace[semantic_source='ads_by_channel', source_role=&Unionset, delivery=&FinalAggregates]
        Project[$1, $0, $3, $2]
          Project[coalesce($0, $3):string?, coalesce($1, $4):string?, $2, $5]
            Join[&Outer, and(is_not_distinct_from($1, $4):boolean, is_not_distinct_from($0, $3):boolean):boolean => $0, $1, $2, $3, $4, $5]
              + Opt:Trace[semantic_source='ads_by_channel.ads', source_role=&Grainset, originators=('ads_by_channel',), cardinality=&OneToOne]
              Project[$1, $0, $2]
                Aggregate[$1, $0 => $1, $0, sum($2, overflow⇒[ERROR]):i64?]
                  Project[$0, 'web', $1]
                    Read[warehouse.ads_clicks => campaign:string?, clicks:i64?]
                      + Opt:Trace[semantic_source='ads_by_channel.ads.clicks_by_campaign', source_role=&Dataset, originators=('ads_by_channel.ads',), physical_source='ads_clicks']
              Project[$1, $0, $2]
                Aggregate[$1, $0 => $1, $0, sum($2, overflow⇒[ERROR]):i64?]
                  Project[$0, 'web', $1]
                    Read[warehouse.ads_cost => campaign:string?, cost:i64?]
                      + Opt:Trace[semantic_source='ads_by_channel.ads.cost_by_campaign', source_role=&Dataset, originators=('ads_by_channel.ads',), physical_source='ads_cost']
        Project[$0, $1, $2, $3]
          Aggregate[$1, $0 => $1, $0, sum($4, overflow⇒[ERROR]):i64?, sum($2, overflow⇒[ERROR]):i64?]
            Project[$0, $1, $3, $2, $5, $4]
              Project[$0, 'store', true, $2, true, $1]
                Read[warehouse.ads_store => campaign:string?, cost:i64?, clicks:i64?]
                  + Opt:Trace[semantic_source='ads_by_channel.ads_store', source_role=&Dataset, originators=('ads_by_channel',), physical_source='ads_store']

disjoint_branch_computes_a_metric_no_child_maps_whole:
  # The Unionset lowers cpi in one projection above the union of its branches, and the Grainset branch gives cost and impressions through its drill-across: web A is 40 / 80 = 0.5, B and C have a NULL side, the NULL campaign is 9 / 36 = 0.25, and the store branch maps no impressions, so its cpi is NULL.
  model: models/marketing_all_spend
  request:
    from: ads_by_channel
    select: [channel, campaign, cpi]
  expect:
    rows:
      - [channel, campaign, cpi]
      - [web, A, 0.5]
      - [web, B, null]
      - [web, C, null]
      - [web, null, 0.25]
      - [store, A, null]
  sql: SELECT 'web' AS channel, coalesce(i.campaign, c.campaign) AS campaign, CAST(c.cost AS DOUBLE) / i.impressions AS cpi FROM (SELECT campaign, sum(impressions) AS impressions FROM warehouse.ads_clicks GROUP BY campaign) i FULL JOIN (SELECT campaign, sum(cost) AS cost FROM warehouse.ads_cost GROUP BY campaign) c ON i.campaign IS NOT DISTINCT FROM c.campaign UNION ALL SELECT 'store', campaign, CAST(NULL AS DOUBLE) FROM warehouse.ads_store GROUP BY campaign
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
      @  2: extension:io.substrait:functions_comparison
      @  3: extension:io.substrait:functions_boolean
    Functions:
      #  1 @  1: sum
      #  2 @  2: is_not_distinct_from
      #  3 @  3: and
      #  4 @  2: coalesce
      #  5 @  1: divide

    === Plan
    Root[channel, campaign, cpi]
      Project[$1, $0, $2]
        + Opt:Trace[scope_root='ads_by_channel', compositions=2, granularity_fit=&NotSelected]
        Project[$1, $0, divide(($2)::!fp64?, (($3)::!i64?)::!fp64?, on_division_by_zero⇒[NULL]):fp64?]
          Set[&UnionAll => $0, $1, $2, $3]
            + Opt:Trace[semantic_source='ads_by_channel', source_role=&Unionset, delivery=&FinalAggregates]
            Project[$0, $1, $5, $4]
              Project[$1, $0, $3, $5, $4, $2]
                Project[coalesce($0, $4):string?, coalesce($1, $5):string?, $6, $7, $2, $3]
                  Join[&Outer, and(is_not_distinct_from($1, $5):boolean, is_not_distinct_from($0, $4):boolean):boolean => $0, $1, $2, $3, $4, $5, $6, $7]
                    + Opt:Trace[semantic_source='ads_by_channel.ads', source_role=&Grainset, originators=('ads_by_channel',), cardinality=&OneToOne]
                    Project[$1, $0, $2, $2]
                      Aggregate[$1, $0 => $1, $0, sum($2, overflow⇒[ERROR]):i64?]
                        Project[$0, 'web', $1]
                          Read[warehouse.ads_clicks => campaign:string?, impressions:i64?]
                            + Opt:Trace[semantic_source='ads_by_channel.ads.clicks_by_campaign', source_role=&Dataset, originators=('ads_by_channel.ads',), physical_source='ads_clicks']
                    Project[$1, $0, $2, $2]
                      Aggregate[$1, $0 => $1, $0, sum($2, overflow⇒[ERROR]):i64?]
                        Project[$0, 'web', $1]
                          Read[warehouse.ads_cost => campaign:string?, cost:i64?]
                            + Opt:Trace[semantic_source='ads_by_channel.ads.cost_by_campaign', source_role=&Dataset, originators=('ads_by_channel.ads',), physical_source='ads_cost']
            Project[$0, $1, $2, $3]
              Aggregate[$1, $0 => $1, $0, sum($2, overflow⇒[ERROR]):i64?, sum($3, overflow⇒[ERROR]):i64?]
                Project[$0, $1, $3, $4, $2]
                  Project[$0, 'store', true, $1, null:i64?]
                    Read[warehouse.ads_store => campaign:string?, cost:i64?]
                      + Opt:Trace[semantic_source='ads_by_channel.ads_store', source_role=&Dataset, originators=('ads_by_channel',), physical_source='ads_store']

