disjoint_branch_lowers_a_condition_onto_the_measures_its_grainset_serves:
  # cpi_of_a filters campaign = 'A', which the Unionset lowers onto cost and impressions in each branch beside cpi: the Grainset branch gives both under it and unconditioned, so web A is 40 / 80 = 0.5 for both, and the other campaigns are NULL under the condition.
