t), CAST(NULL AS BIGINT) FROM warehouse.ads_store WHERE campaign = 'D' GROUP BY campaign) u GROUP BY channel, campaign) GROUP BY channel) n ON coalesce(c.channel, g.channel) IS NOT DISTINCT FROM n.channel
