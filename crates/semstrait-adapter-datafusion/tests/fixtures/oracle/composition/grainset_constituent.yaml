disjoint_branch_computes_a_metric_with_its_own_agg:
  # The Unionset runs avg_cpi in its branches: the Grainset branch averages cost / impressions per campaign over its children (A 0.5, the NULL campaign 0.25, B and C NULL), and the store branch maps no impressions, so its avg_cpi is NULL.
  model: models/marketing_all_spend
  request:
    from: ads_by_channel
    select: [channel, campaign, avg_cpi]
  expect:
    rows:
      - [channel, campaign, avg_cpi]
      - [web, A, 0.5]
      - [web, B, null]
      - [web, C, null]
      - [web, null, 0.25]
      - [store, A, null]
  sql: SELECT 'web' AS channel, campaign, avg(formula) AS avg_cpi FROM (SELECT coalesce(i.campaign, c.campaign) AS campaign, CAST(c.cost AS DOUBLE) / i.impressions AS formula FROM (SELECT campaign, sum(impressions) AS impressions FROM warehouse.ads_clicks GROUP BY campaign) i FULL JOIN (SELECT campaign, sum(cost) AS cost FROM warehouse.ads_cost GROUP BY campaign) c ON i.campaign IS NOT DISTINCT FROM c.campaign) GROUP BY campaign UNION ALL SELECT 'store', campaign, CAST(NULL AS DOUBLE) FROM warehouse.ads_store GROUP BY campaign
