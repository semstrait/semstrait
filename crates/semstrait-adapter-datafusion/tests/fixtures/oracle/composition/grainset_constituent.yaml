operand_kept_alone_computes_a_parts_metric_by_two_dimensions_with_null_values:
  # gender_cost_per_user grouped by campaign and gender, where both children hold a NULL gender of A and a NULL campaign with a NULL gender: the parts join on (campaign, gender, key) NULL-safe, so (A, NULL) is 6 / 2 = 3.0 and (NULL, NULL) is 8 / 1 = 8.0 in one row each, (A, f) is 10 / 2 * 2 = 10.0 and (B, f) 14.0, and the groups that one child holds are NULL.
  model: models/marketing_all_spend
  request:
    from: campaign_ads
    select: [campaign, gender, gender_cost_per_user]
  input_data:
    warehouse.ads_by_gender:
      - [A, f, 10, 5]
      - [A, m, 20, 5]
      - [A, null, 6, 3]
      - [B, f, 7, 2]
      - [null, null, 8, 4]
      - [null, m, 4, 2]
    warehouse.ads_users:
      - [A, f, u1, web]
      - [A, f, u2, web]
      - [A, m, u2, store]
      - [A, m, u3, web]
      - [A, null, u4, null]
      - [A, null, u6, web]
      - [B, f, u5, web]
      - [B, m, u8, web]
      - [null, null, u7, web]
  expect:
    rows:
      - [campaign, gender, gender_cost_per_user]
      - [A, f, 10.0]
      - [A, m, 10.0]
      - [A, null, 3.0]
      - [B, f, 14.0]
      - [B, m, null]
      - [null, null, 8.0]
      - [null, m, null]
