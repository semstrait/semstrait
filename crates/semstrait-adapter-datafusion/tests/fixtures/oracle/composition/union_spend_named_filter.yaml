                              Project[$0, $1, (date_trunc('day', $2):date?)::!date?]
                                Project[$1, 'web', $0]
                                  Read[warehouse.spend_flat => day:date?, budget:i64?]
                                    + Opt:Trace[semantic_source='days_by_channel.spend_days.days_budget', source_role=&Dataset, originators=('days_by_channel.spend_days',), physical_source='spend_flat']
                          Project[$0, $2, $2, $1]
                            Aggregate[$0, $2 => $0, $2, sum($1, overflow⇒[ERROR]):i64?]
                              Project[$0, $1, (date_trunc('day', $2):date?)::!date?]
                                Project['web', $1, $0]
                                  Read[warehouse.spend_daily => day:date?, clicks:i64?]
                                    + Opt:Trace[semantic_source='days_by_channel.spend_days.days_clicks', source_role=&Dataset, originators=('days_by_channel.spend_days',), physical_source='spend_daily']
                  Project[$0, $1, $2, $3, $4, $5, $6]
                    Aggregate[$2, $3 => $2, $3, sum($0, overflow⇒[ERROR]):i64?, sum($4, overflow⇒[ERROR]):i64?, sum($5, overflow⇒[ERROR]):i64?, sum($6, overflow⇒[ERROR]):i64?, sum($7, overflow⇒[ERROR]):i64?]
