web_cpc2_on_a_unionset_branch_by_channel_and_campaign:
  # web_cpc2 divides web_budget by clicks, and web_budget is NULL on the store branch, so every store row is NULL and the web rows are budget over clicks of the web branch's Full drill-across: A is 130 / 30 and B is 70 / 40.
  model: models/spend_named_filter
  request:
    from: days_by_channel
    select: [channel, campaign, web_cpc2]
  expect:
    rows:
      - [channel, campaign, web_cpc2]
      - [web, A, 4.333333333333333]
      - [web, B, 1.75]
      - [store, A, null]
      - [store, B, null]
