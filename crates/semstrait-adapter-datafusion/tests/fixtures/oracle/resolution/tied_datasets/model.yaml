# A model of two Datasets that tie on every field-first resolution rank.
semantic_model:
  name: twins
  dimensions:
    - name: region
      data_type: string
      type: categorical
  measures:
    - name: revenue
      data_type: double
      agg: sum
  datasets:
    - name: orders_a
      extras:
        storage:
          tables: [warehouse.orders]
        semantic_mapping:
          region: region
          revenue: amount
      dimensions:
        - ref: region
      measures:
        - ref: revenue
    - name: orders_b
      extras:
        storage:
          tables: [warehouse.orders]
        semantic_mapping:
          region: region
          revenue: amount
      dimensions:
        - ref: region
      measures:
        - ref: revenue
