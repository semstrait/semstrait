bucketed_time_axis:
  # Bucketing a Dataset's own time axis puts it alone in granularity fit's first group, so it answers.
  model: resolution/time_axis_candidates
  request:
    select: [{dimension: order_date, granularity: month}, revenue]
  expect:
    rows:
      - [order_date, revenue]
      - [2026-03-01, 30.0]
      - [2026-04-01, 5.0]
  sql: SELECT date_trunc('month', order_date) AS order_date, sum(revenue) AS revenue FROM warehouse.orders GROUP BY 1
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:semstrait:datafusion
      @  2: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: date_trunc
      #  2 @  2: sum

    === Plan
    Root[order_date, revenue]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='orders', compositions=0, granularity_fit=&Requested, granularity=&Day]
        Project[(date_trunc('month', $0):date?)::!date?, $1]
          Project[$0, $1]
            Read[warehouse.orders => order_date:date?, revenue:fp64?]
              + Opt:Trace[semantic_source='orders', source_role=&Dataset, physical_source='orders']

