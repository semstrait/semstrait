# Field-first resolution picks a request's scope root among public candidates by compositions, granularity fit, exposed semantics and name order.

lower_case_label:
  # Selecting from the lower-case Dataset computes its own lower-case region label.
  model: models/commerce
  request:
    from: lower_orders
    select: [region_label, revenue]
  expect:
    rows:
      - [region_label, revenue]
      - [eu, 150.0]
      - [us, 210.0]
  sql: SELECT lower(region) AS region_label, sum(amount) AS revenue FROM warehouse.orders GROUP BY lower(region)
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_string
      @  2: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: lower
      #  2 @  2: sum

    === Plan
    Root[region_label, revenue]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='lower_orders', compositions=0, granularity_fit=&NotSelected]
        Project[lower($0):string?, $1]
          Read[warehouse.orders => region:string?, amount:fp64?]
            + Opt:Trace[semantic_source='lower_orders', source_role=&Dataset, physical_source='orders']

