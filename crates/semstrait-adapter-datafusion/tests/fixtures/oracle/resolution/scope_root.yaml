fewer_semantics_wins:
  # Two candidates tie on compositions and granularity fit, so the one exposing fewer semantics answers.
  model: resolution/semantics_candidates
  request:
    select: [{dimension: date, granularity: month}, campaign, clicks]
  expect:
    rows:
      - [date, campaign, clicks]
      - [2026-03-01, A, 40]
      - [2026-03-01, B, 20]
  sql: SELECT date_trunc('month', day) AS date, campaign_id AS campaign, sum(click_count) AS clicks FROM (SELECT * FROM warehouse.web_clicks UNION ALL SELECT * FROM warehouse.app_clicks) GROUP BY 1, 2
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
      @  2: extension:semstrait:datafusion
    Functions:
      #  1 @  1: sum
      #  2 @  2: date_trunc

    === Plan
    Root[date, campaign, clicks]
      Aggregate[$2, $0 => $2, $0, sum($1, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='all_clicks', compositions=1, granularity_fit=&Requested, granularity=&Day]
        Project[$0, $1, (date_trunc('month', $2):date?)::!date?]
          Project[$1, $2, $0]
            Set[&UnionAll => $0, $1, $2]
              + Opt:Trace[semantic_source='all_clicks', source_role=&Unionset, delivery=&PartialAggregates]
              Aggregate[$3, $0 => $3, $0, sum($1, overflow⇒[ERROR]):i64?]
                Project[$0, $2, $1, $3]
                  Project[$1, true, $2, $0]
                    Read[warehouse.app_clicks => day:date?, campaign_id:string?, click_count:i64?]
                      + Opt:Trace[semantic_source='all_clicks.app_clicks', source_role=&Dataset, originators=('all_clicks',), physical_source='app_clicks']
              Project[$0, $1, $2]
                Aggregate[$3, $0 => $3, $0, sum($1, overflow⇒[ERROR]):i64?]
                  Project[$0, $2, $1, $3]
                    Project[$1, true, $2, $0]
                      Read[warehouse.web_clicks => day:date?, campaign_id:string?, click_count:i64?]
                        + Opt:Trace[semantic_source='all_clicks.web_clicks', source_role=&Dataset, originators=('all_clicks',), physical_source='web_clicks']

