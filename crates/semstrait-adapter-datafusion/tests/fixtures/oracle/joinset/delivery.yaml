# A Joinset's operand gives rows or partial aggregates below the join, combined once above it.

one_row_per_join_key:
  # An operand that gives partial aggregates per join key meets its partner once, with no fan-out marker.
  model: models/marketing
  request:
    from: campaigns_spend
    select: [campaign_name, budget, cost]
  input_data:
    warehouse.spend:
      - [A, 2026-03-10, 10]
      - [A, 2026-03-20, 20]
      - [B, 2026-03-10, 60]
  expect:
    rows:
      - [campaign_name, budget, cost]
      - [Summer, 300, 90]
  sql: >-
    SELECT c.campaign_name, sum(c.budget) AS budget, sum(s.cost) AS cost
    FROM warehouse.campaigns c
    JOIN (SELECT campaign_id, sum(cost) AS cost FROM warehouse.spend
    GROUP BY campaign_id) s
    ON c.campaign_id = s.campaign_id GROUP BY 1
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
      @  2: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: sum
      #  2 @  2: equal

    === Plan
    Root[campaign_name, budget, cost]
      Aggregate[$1 => $1, sum($0, overflow⇒[ERROR]):i64?, sum($2, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='campaigns_spend', compositions=1, granularity_fit=&NotSelected, granularity=&Day]
        Project[$2, $0, $4]
          Join[&Inner, equal($1, $3):boolean? => $0, $1, $2, $3, $4]
            + Opt:Trace[semantic_source='campaigns_spend', source_role=&Joinset, cardinality=&OneToMany]
            Aggregate[$2, $1 => $2, $1, sum($0, overflow⇒[ERROR]):i64?]
              Project[$1, $2, $0]
                Read[warehouse.campaigns => campaign_name:string?, budget:i64?, campaign_id:string?]
                  + Opt:Trace[semantic_source='campaigns_spend.campaigns', source_role=&Dataset, originators=('campaigns_spend',), physical_source='campaigns']
            Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
              Project[$1, $0]
                Read[warehouse.spend => cost:i64?, campaign_id:string?]
                  + Opt:Trace[semantic_source='campaigns_spend.spend', source_role=&Dataset, originators=('campaigns_spend',), physical_source='spend']

no_match_coalesced_zero:
  # Where the join gives no row, the re-aggregated partial count coalesces to zero.
  model: models/commerce_own_tables
  request:
    from: orders_inner_customers
    select: [order_count]
    where: {eq: [segment, {lit: vip}]}
  expect:
    rows:
      - [order_count]
      - [0]
  sql: >-
    SELECT coalesce(sum(o.order_count), 0) AS order_count
    FROM (SELECT customer_id, count(order_id) AS order_count FROM warehouse.orders
    GROUP BY customer_id) o
    JOIN (SELECT * FROM warehouse.customers WHERE segment = 'vip') c
    ON o.customer_id = c.customer_id
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_aggregate_generic
      @  2: extension:io.substrait:functions_comparison
      @  3: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: count
      #  2 @  2: equal
      #  3 @  3: sum
      #  4 @  2: coalesce

    === Plan
    Root[order_count]
      Project[coalesce($0, 0):i64]
        + Opt:Trace[scope_root='orders_inner_customers', compositions=1, granularity_fit=&NotSelected]
        Aggregate[_ => sum($0, overflow⇒[ERROR]):i64?]
          Project[$1]
            Join[&Inner, equal($0, $2):boolean? => $0, $1, $2]
              + Opt:Trace[semantic_source='orders_inner_customers', source_role=&Joinset, cardinality=&ManyToOne]
              Aggregate[$0 => $0, count($1, overflow⇒[ERROR]):i64]
                Project[$1, $0]
                  Read[warehouse.orders => order_id:i64?, customer_id:i64?]
                    + Opt:Trace[semantic_source='orders_inner_customers.orders', source_role=&Dataset, originators=('orders_inner_customers',), physical_source='orders']
              Aggregate[$0 => $0]
                Filter[equal($1, 'vip'):boolean? => $0, $1]
                  Project[$0, $1]
                    Read[warehouse.customers => customer_id:i64?, segment:string?]
                      + Opt:Trace[semantic_source='orders_inner_customers.customers', source_role=&Dataset, originators=('orders_inner_customers',), physical_source='customers']

many_to_many_duplicate_rows:
  # A many-to-many join's partial aggregates keep both of two equal rows that an inferred identity would merge.
  model: models/marketing
  request:
    from: tags_spend2
    select: [tag, cost]
  expect:
    rows:
      - [tag, cost]
      - [x, 25]
      - [y, 20]
  sql: >-
    SELECT t.tag, sum(s.cost) AS cost
    FROM warehouse.tags t
    JOIN (SELECT campaign_id, sum(cost) AS cost FROM warehouse.spend2
    GROUP BY campaign_id) s
    ON t.campaign_id = s.campaign_id GROUP BY 1
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
      @  2: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: sum
      #  2 @  2: equal

    === Plan
    Root[tag, cost]
      Aggregate[$1 => $1, sum($0, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='tags_spend2', compositions=1, granularity_fit=&NotSelected]
        Project[$3, $0]
          Join[&Inner, equal($1, $2):boolean? => $0, $1, $2, $3]
            + Opt:Trace[semantic_source='tags_spend2', source_role=&Joinset, cardinality=&ManyToMany]
            Aggregate[$1, $0 => $1, $0]
              Project[$1, $0]
                Read[warehouse.tags => tag:string?, campaign_id:string?]
                  + Opt:Trace[semantic_source='tags_spend2.tags', source_role=&Dataset, originators=('tags_spend2',), physical_source='tags']
            Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
              Project[$1, $0]
                Read[warehouse.spend2 => cost:i64?, campaign_id:string?]
                  + Opt:Trace[semantic_source='tags_spend2.spend2', source_role=&Dataset, originators=('tags_spend2',), physical_source='spend2']

both_sides_partial_below_join:
  # Both operands give partial aggregates grouped by the join key, combined once above the join.
  model: models/marketing
  request:
    from: spend_bookings
    select: [{dimension: date, granularity: month}, cost, revenue]
  expect:
    rows:
      - [date, cost, revenue]
      - [2026-03-01, 15, 150]
  sql: >-
    SELECT date_trunc('month', s.date) AS date, sum(s.cost) AS cost,
    sum(b.revenue) AS revenue
    FROM (SELECT campaign_id, date, sum(cost) AS cost FROM warehouse.spend
    GROUP BY campaign_id, date) s
    JOIN (SELECT campaign_id, date, sum(revenue) AS revenue FROM warehouse.bookings
    GROUP BY campaign_id, date) b
    ON s.campaign_id = b.campaign_id AND s.date = b.date GROUP BY 1
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
      @  2: extension:io.substrait:functions_comparison
      @  3: extension:io.substrait:functions_boolean
      @  4: extension:semstrait:datafusion
    Functions:
      #  1 @  1: sum
      #  2 @  2: equal
      #  3 @  3: and
      #  4 @  2: coalesce
      #  5 @  4: date_trunc

    === Plan
    Root[date, cost, revenue]
      Aggregate[$1 => $1, sum($0, overflow⇒[ERROR]):i64?, sum($2, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='spend_bookings', compositions=1, granularity_fit=&Requested, granularity=&Day]
        Project[$0, (date_trunc('month', $1):date?)::!date?, $2]
          Project[$2, coalesce($0, $3):date?, $5]
            Join[&Inner, and(equal($1, $4):boolean?, equal($0, $3):boolean?):boolean? => $0, $1, $2, $3, $4, $5]
              + Opt:Trace[semantic_source='spend_bookings', source_role=&Joinset, cardinality=&OneToOne]
              Aggregate[$2, $0 => $2, $0, sum($1, overflow⇒[ERROR]):i64?]
                Project[$2, $1, $0]
                  Read[warehouse.spend => date:date?, cost:i64?, campaign_id:string?]
                    + Opt:Trace[semantic_source='spend_bookings.spend_j', source_role=&Dataset, originators=('spend_bookings',), physical_source='spend']
              Aggregate[$1, $0 => $1, $0, sum($2, overflow⇒[ERROR]):i64?]
                Project[$2, $0, $1]
                  Read[warehouse.bookings => date:date?, revenue:i64?, campaign_id:string?]
                    + Opt:Trace[semantic_source='spend_bookings.bookings_j', source_role=&Dataset, originators=('spend_bookings',), physical_source='bookings']

partial_meets_own_channel:
  # Each operand's own grouping column survives below the join, so a bucket there still separates by it.
  model: models/marketing
  request:
    from: spend_bookings
    select: [{dimension: date, granularity: month}, channel, cost]
  expect:
    rows:
      - [date, channel, cost]
      - [2026-03-01, app, 10]
      - [2026-03-01, web, 5]
  sql: >-
    SELECT date_trunc('month', s.date) AS date, b.channel, sum(s.cost) AS cost
    FROM (SELECT campaign_id, date, sum(cost) AS cost FROM warehouse.spend
    GROUP BY campaign_id, date) s
    JOIN (SELECT campaign_id, date, channel FROM warehouse.bookings
    GROUP BY campaign_id, date, channel) b
    ON s.campaign_id = b.campaign_id AND s.date = b.date GROUP BY 1, 2
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
      @  2: extension:io.substrait:functions_comparison
      @  3: extension:io.substrait:functions_boolean
      @  4: extension:semstrait:datafusion
    Functions:
      #  1 @  1: sum
      #  2 @  2: equal
      #  3 @  3: and
      #  4 @  2: coalesce
      #  5 @  4: date_trunc

    === Plan
    Root[date, channel, cost]
      Aggregate[$2, $0 => $2, $0, sum($1, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='spend_bookings', compositions=1, granularity_fit=&Requested, granularity=&Day]
        Project[$0, $1, (date_trunc('month', $2):date?)::!date?]
          Project[$4, $2, coalesce($0, $3):date?]
            Join[&Inner, and(equal($1, $5):boolean?, equal($0, $3):boolean?):boolean? => $0, $1, $2, $3, $4, $5]
              + Opt:Trace[semantic_source='spend_bookings', source_role=&Joinset, cardinality=&OneToOne]
              Aggregate[$2, $0 => $2, $0, sum($1, overflow⇒[ERROR]):i64?]
                Project[$2, $1, $0]
                  Read[warehouse.spend => date:date?, cost:i64?, campaign_id:string?]
                    + Opt:Trace[semantic_source='spend_bookings.spend_j', source_role=&Dataset, originators=('spend_bookings',), physical_source='spend']
              Aggregate[$2, $1, $0 => $2, $1, $0]
                Project[$2, $1, $0]
                  Read[warehouse.bookings => date:date?, channel:string?, campaign_id:string?]
                    + Opt:Trace[semantic_source='spend_bookings.bookings_j', source_role=&Dataset, originators=('spend_bookings',), physical_source='bookings']

non_additive_gives_rows:
  # A non-additive measure's operand gives rows, not partial aggregates, below the join.
  model: models/marketing
  request:
    from: spend_bookings
    select: [{dimension: date, granularity: month}, avg_cost, revenue]
  expect:
    rows:
      - [date, avg_cost, revenue]
      - [2026-03-01, 7.5, 150]
  sql: >-
    SELECT date_trunc('month', s.date) AS date, avg(s.cost) AS avg_cost,
    sum(b.revenue) AS revenue FROM warehouse.spend s
    JOIN (SELECT campaign_id, date, sum(revenue) AS revenue FROM warehouse.bookings
    GROUP BY campaign_id, date) b
    ON s.campaign_id = b.campaign_id AND s.date = b.date GROUP BY 1
