marker_per_order_not_line:
  # A fan-out average reads one row per order under the marker, while the other side reads every line.
  model: models/commerce
  request:
    from: shipping
    select: [region, avg_shipping, avg_price]
  input_data:
    warehouse.order_lines:
      - [l1, o1, null, 2.0]
      - [l2, o1, null, 2.0]
      - [l3, o1, null, 2.0]
      - [l4, o2, null, 4.0]
      - [l5, o3, null, 5.0]
      - [l6, o3, null, 5.0]
      - [l7, o4, null, 8.0]
    warehouse.orders:
      - [o1, null, eu, null, null, null, null, 10.0, null]
      - [o2, null, eu, null, null, null, null, 20.0, null]
      - [o3, null, us, null, null, null, null, 5.0, null]
      - [o4, null, us, null, null, null, null, 7.0, null]
  expect:
    rows:
      - [region, avg_shipping, avg_price]
      - [eu, 15.0, 2.5]
