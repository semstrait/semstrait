  sql: >-
    SELECT region, avg(shipping_cost) FILTER (WHERE marker = 1) AS avg_shipping,
    avg(price) AS avg_price
    FROM (SELECT o.region, o.shipping_cost, l.price, row_number() OVER
    (PARTITION BY o.region, o.order_id, o.shipping_cost) AS marker
    FROM warehouse.orders o LEFT JOIN warehouse.order_lines l
