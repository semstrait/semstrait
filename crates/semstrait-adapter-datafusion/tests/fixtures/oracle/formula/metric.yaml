bonus_joined_to_buyers:
  # A Metric's part-key subtree joins the frame's buyers subtree on IS NOT DISTINCT FROM.
  model: models/commerce
  request:
    from: orders
    select: [channel, revenue_eu_bonus, buyers]
  expect:
    rows:
      - [channel, revenue_eu_bonus, buyers]
      - [web, 400.0, 1]
      - [app, 150.0, 1]
      - [null, 10.0, 1]
  sql: >-
    SELECT b.channel, p.revenue_eu_bonus, b.buyers
    FROM (SELECT channel, count(DISTINCT customer_id) AS buyers FROM warehouse.orders GROUP BY channel) b
    JOIN (SELECT channel, sum(CASE WHEN part = 1 THEN revenue + 100.0 ELSE revenue END) AS revenue_eu_bonus
    FROM (SELECT channel, CASE WHEN region = 'eu' THEN 1 ELSE 2 END AS part, sum(amount) AS revenue
    FROM warehouse.orders GROUP BY 1, 2) GROUP BY channel) p
    ON b.channel IS NOT DISTINCT FROM p.channel
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_aggregate_generic
      @  2: extension:io.substrait:functions_comparison
      @  3: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: count
      #  2 @  2: equal
      #  3 @  3: sum
      #  4 @  3: add
      #  5 @  2: is_not_distinct_from

    === Plan
    Root[channel, revenue_eu_bonus, buyers]
      Project[$0, $3, $1]
        + Opt:Trace[scope_root='orders', compositions=0, granularity_fit=&NotSelected]
        Join[&Inner, is_not_distinct_from($0, $2):boolean => $0, $1, $2, $3]
          Aggregate[$1 => $1, count($0, overflow⇒[ERROR]):i64]
            Project[$3, $0]
              Read[warehouse.orders => channel:string?, region:string?, amount:fp64?, customer_id:string?]
                + Opt:Trace[semantic_source='orders', source_role=&Dataset, physical_source='orders']
          Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
            Project[$0, if_then(equal($1, 1):boolean -> add($2, 100):fp64?, _ -> $3)]
              Aggregate[$0, $3 => $0, $3, sum($1, overflow⇒[ERROR]):fp64?, sum($2, overflow⇒[ERROR]):fp64?]
                Project[$0, $2, $2, if_then(equal($1, 'eu'):boolean? -> 1, _ -> 2)]
                  Read[warehouse.orders => channel:string?, region:string?, amount:fp64?, customer_id:string?]
                    + Opt:Trace[semantic_source='orders', source_role=&Dataset, physical_source='orders']

