pushdown_to_union_root:
  # A formula pushed down to a Unionset's non-disjoint branches sums each branch's own row argument.
  model: models/commerce_own_formula
  request:
    from: split_orders
    select: [channel, revenue_adj]
  expect:
    rows:
      - [channel, revenue_adj]
      - [web, 320.0]
      - [app, 60.0]
      - [null, 10.0]
  sql: >-
    SELECT channel, sum(CASE WHEN region = 'eu' THEN amount * 1.2 ELSE amount END) AS revenue_adj
    FROM (SELECT * FROM warehouse.eu_orders UNION ALL SELECT * FROM warehouse.us_orders)
    GROUP BY channel
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:io.substrait:functions_arithmetic
