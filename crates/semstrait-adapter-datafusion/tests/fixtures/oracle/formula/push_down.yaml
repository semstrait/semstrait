# A formula pushes its sum down past a Unionset's branches, a Joinset's non-repeating side, or a Grainset operand.

case_over_grainset_operand:
  # A CASE's parts are summed separately where the formula's value comes from a Grainset operand.
  model: models/marketing_eu_budget
  request:
    from: g_campaigns
    select: [bonus]
  expect:
    rows:
      - [bonus]
      - [420.0]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
      @  2: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: sum
      #  2 @  2: equal
      #  3 @  1: add

    === Plan
    Root[bonus]
      Aggregate[_ => sum($0, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='g_campaigns', compositions=2, granularity_fit=&NotSelected, granularity=&Month]
        Project[add(if_then(equal($0, 1):boolean -> 100, equal($0, 2):boolean -> 100, _ -> 0), ($1)::!fp64?):fp64?]
          Aggregate[$1 => $1, sum($0, overflow⇒[ERROR]):fp64?]
            Project[$2, if_then(equal($0, 'SE'):boolean? -> 1, equal($3, 'us'):boolean? -> 2, _ -> 3)]
              Join[&Inner, equal($1, $4):boolean? => $0, $1, $2, $3, $4]
                + Opt:Trace[semantic_source='g_campaigns', source_role=&Joinset, cardinality=&ManyToOne]
                Aggregate[$2, $1 => $2, $1, sum($0, overflow⇒[ERROR]):fp64?]
                  + Opt:Trace[semantic_source='g_campaigns.g', source_role=&Grainset, originators=('g_campaigns',), answered_by='g_campaigns.g.g_month']
                  Project[$1, $2, $0]
                    Read[warehouse.g_month => country:string?, budget:fp64?, campaign_id:string?]
                      + Opt:Trace[semantic_source='g_campaigns.g.g_month', source_role=&Dataset, originators=('g_campaigns.g',), physical_source='g_month']
                Aggregate[$1, $0 => $1, $0]
                  Project[$1, $0]
                    Read[warehouse.campaigns => region:string?, campaign_id:string?]
                      + Opt:Trace[semantic_source='g_campaigns.campaigns', source_role=&Dataset, originators=('g_campaigns',), physical_source='campaigns']

pushdown_meets_grainset:
  # A pushed-down formula meets a Grainset, which gives aggregates, so it takes the parts instead.
  model: models/marketing_eu_budget
  request:
    from: g_campaigns
    select: [budget_eu]
  expect:
    rows:
      - [budget_eu]
      - [250.0]
  sql: >-
    SELECT sum(CASE WHEN part = 1 THEN budget * 1.2 ELSE budget END) AS budget_eu
    FROM (SELECT CASE WHEN c.region = 'eu' THEN 1 ELSE 2 END AS part, sum(g.budget) AS budget
    FROM (SELECT campaign_id, sum(budget) AS budget FROM warehouse.g_month GROUP BY campaign_id) g
    JOIN warehouse.campaigns c ON g.campaign_id = c.campaign_id
    GROUP BY part)
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
      @  2: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: sum
      #  2 @  2: equal
      #  3 @  1: multiply

    === Plan
    Root[budget_eu]
      Aggregate[_ => sum($0, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='g_campaigns', compositions=2, granularity_fit=&NotSelected, granularity=&Month]
        Project[if_then(equal($0, 1):boolean -> multiply(($1)::!fp64?, 1.2):fp64?, _ -> ($2)::!fp64?)]
          Aggregate[$2 => $2, sum($0, overflow⇒[ERROR]):fp64?, sum($1, overflow⇒[ERROR]):fp64?]
            Project[$1, $1, if_then(equal($2, 'eu'):boolean? -> 1, _ -> 2)]
              Join[&Inner, equal($0, $3):boolean? => $0, $1, $2, $3]
                + Opt:Trace[semantic_source='g_campaigns', source_role=&Joinset, cardinality=&ManyToOne]
                Aggregate[$1 => $1, sum($0, overflow⇒[ERROR]):fp64?]
                  + Opt:Trace[semantic_source='g_campaigns.g', source_role=&Grainset, originators=('g_campaigns',), answered_by='g_campaigns.g.g_month']
                  Project[$0, $1]
                    Read[warehouse.g_month => budget:fp64?, campaign_id:string?]
                      + Opt:Trace[semantic_source='g_campaigns.g.g_month', source_role=&Dataset, originators=('g_campaigns.g',), physical_source='g_month']
                Aggregate[$1, $0 => $1, $0]
                  Project[$1, $0]
                    Read[warehouse.campaigns => region:string?, campaign_id:string?]
                      + Opt:Trace[semantic_source='g_campaigns.campaigns', source_role=&Dataset, originators=('g_campaigns',), physical_source='campaigns']

