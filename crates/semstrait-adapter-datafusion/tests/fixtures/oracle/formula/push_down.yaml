      #  3 @  2: sum

    === Plan
    Root[channel, revenue_adj]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='split_orders', compositions=1, granularity_fit=&NotSelected]
        Project[$0, if_then(equal($1, 'eu'):boolean? -> multiply($3, 1.2):fp64?, _ -> $3), $2]
          Set[&UnionAll => $0, $1, $2, $3]
            + Opt:Trace[semantic_source='split_orders', source_role=&Unionset, delivery=&Rows]
            Project[$0, $1, true, $2]
