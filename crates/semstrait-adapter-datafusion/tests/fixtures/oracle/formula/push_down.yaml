pushdown_through_union_branches:
  # A formula pushed down through a Unionset finds no join that repeats its value, so each branch gives rows.
  model: models/commerce_own_union
  request:
    from: union_customers
    select: [region, vip_weighted_revenue]
  expect:
    rows:
      - [region, vip_weighted_revenue]
      - [eu, 300.0]
      - [us, 410.0]
  sql: >-
    SELECT o.region_code AS region,
    sum(CASE WHEN c.segment = 'vip' THEN o.amount * 2.0 ELSE o.amount END) AS vip_weighted_revenue
    FROM (SELECT * FROM warehouse.orders_eu UNION ALL SELECT * FROM warehouse.orders_us) o
    LEFT JOIN warehouse.customers c ON o.cust_key = c.customer_id
