web_and_not_app:
  # Two activated named filters both go into the one child that answers.
  model: models/sales_named_filter
  request:
    from: sales
    select: [{dimension: ordered_at, granularity: month}, revenue]
    filters: [web, not_app]
  expect:
    rows:
      - [ordered_at, revenue]
      - [2026-09-01, 40]
      - [2026-10-01, 150]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:io.substrait:functions_boolean
      @  3: extension:semstrait:datafusion
      @  4: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: equal
      #  2 @  2: not
      #  3 @  2: and
      #  4 @  3: date_trunc
      #  5 @  4: sum

    === Plan
    Root[ordered_at, revenue]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='sales', compositions=1, granularity_fit=&Requested, granularity=&Month]
        + Opt:Trace[semantic_source='sales', source_role=&Grainset, answered_by='sales.m']
        Project[(date_trunc('month', $1):date?)::!date?, $2]
          Filter[and($3, $0):boolean? => $0, $1, $2, $3]
            Project[not(equal($2, 'app'):boolean?):boolean?, $0, $1, equal($2, 'web'):boolean?]
              Read[warehouse.m => month_start:date?, amount:i64?, channel:string?]
                + Opt:Trace[semantic_source='sales.m', source_role=&Dataset, originators=('sales',), physical_source='m']

