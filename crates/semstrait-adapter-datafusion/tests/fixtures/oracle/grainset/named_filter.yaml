# An activated named filter on a Grainset goes unchanged to the child that answers alone, which reads its own signature for it.

web_at_month:
  # The Month child answers alone and reads its own web filter.
  model: models/sales_named_filter
  request:
    from: sales
    select: [{dimension: ordered_at, granularity: month}, revenue]
    filters: [web]
  expect:
    rows:
      - [ordered_at, revenue]
      - [2026-09-01, 40]
      - [2026-10-01, 150]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:semstrait:datafusion
      @  3: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: equal
      #  2 @  2: date_trunc
      #  3 @  3: sum

    === Plan
    Root[ordered_at, revenue]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='sales', compositions=1, granularity_fit=&Requested, granularity=&Month]
        + Opt:Trace[semantic_source='sales', source_role=&Grainset, answered_by='sales.m']
        Project[(date_trunc('month', $0):date?)::!date?, $1]
          Filter[$2 => $0, $1, $2]
            Project[$0, $1, equal($2, 'web'):boolean?]
              Read[warehouse.m => month_start:date?, amount:i64?, channel:string?]
                + Opt:Trace[semantic_source='sales.m', source_role=&Dataset, originators=('sales',), physical_source='m']

