# A named filter on a Grainset goes into each chosen child of a drill-across and into the one child that answers alone.

drill_across_web:
  # No child holds both measures, so each chosen child reads its own web filter.
  model: models/spend_named_filter
  request:
    from: spend
    select: [{dimension: date, granularity: month}, campaign, clicks, budget]
    filters: [web]
  expect:
    rows:
      - [date, campaign, clicks, budget]
      - [2026-03-01, A, 10, 100]
      - [2026-03-01, B, 40, 50]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:semstrait:datafusion
      @  3: extension:io.substrait:functions_arithmetic
      @  4: extension:io.substrait:functions_boolean
    Functions:
      #  1 @  1: equal
      #  2 @  2: date_trunc
      #  3 @  3: sum
      #  4 @  1: is_not_distinct_from
      #  5 @  4: and
      #  6 @  1: coalesce

    === Plan
    Root[date, campaign, clicks, budget]
      Project[$3, $1, $2, $0]
        + Opt:Trace[scope_root='spend', compositions=1, granularity_fit=&Requested, granularity=&Month]
        Project[$0, coalesce($1, $3):string?, $4, coalesce($2, $5):date?]
          Join[&Outer, and(is_not_distinct_from($2, $5):boolean, is_not_distinct_from($1, $3):boolean):boolean => $0, $1, $2, $3, $4, $5]
            + Opt:Trace[semantic_source='spend', source_role=&Grainset, cardinality=&OneToOne]
            Project[$2, $1, $0]
              Aggregate[$2, $1 => $2, $1, sum($0, overflow⇒[ERROR]):i64?]
                Project[$0, $1, (date_trunc('month', $2):date?)::!date?]
                  Filter[$3 => $0, $1, $2, $3]
                    Project[$2, $1, $0, equal($3, 'web'):boolean?]
                      Read[warehouse.spend_monthly => month_start:date?, campaign:string?, budget:i64?, channel:string?]
                        + Opt:Trace[semantic_source='spend.spend_monthly', source_role=&Dataset, originators=('spend',), physical_source='spend_monthly']
            Project[$1, $2, $0]
              Aggregate[$2, $0 => $2, $0, sum($1, overflow⇒[ERROR]):i64?]
                Project[$0, $1, (date_trunc('month', $2):date?)::!date?]
                  Filter[$3 => $0, $1, $2, $3]
                    Project[$1, $2, $0, equal($3, 'web'):boolean?]
                      Read[warehouse.spend_daily => day:date?, campaign:string?, clicks:i64?, channel:string?]
                        + Opt:Trace[semantic_source='spend.spend_daily', source_role=&Dataset, originators=('spend',), physical_source='spend_daily']

