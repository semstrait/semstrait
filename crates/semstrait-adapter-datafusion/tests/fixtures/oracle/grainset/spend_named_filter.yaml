            Project[$2, $0, $1]
              Aggregate[$0, $1 => $0, $1, avg($2, overflow⇒[ERROR]):fp64?]
                Project[$1, $2, divide(($0)::!fp64?, ($3)::!fp64?, on_division_by_zero⇒[ERROR]):fp64?]
                  Project[$0, coalesce($1, $3):string?, coalesce($2, $4):string?, $5]
                    Join[&Outer, and(is_not_distinct_from($1, $3):boolean, is_not_distinct_from($2, $4):boolean):boolean => $0, $1, $2, $3, $4, $5]
                      + Opt:Trace[semantic_source='j.spend', source_role=&Grainset, originators=('j',), cardinality=&OneToOne]
                      Project[$0, $1, $2]
                        Project[$2, $0, $1]
                          Aggregate[$2, $3 => $2, $3, sum($0, overflow⇒[ERROR]):i64?]
                            Project[$2, equal($0, 'A'):boolean?, $0, if_then(equal($1, 'web'):boolean? -> 'WEB', _ -> 'OTHER')]
                              Read[warehouse.spend_monthly => campaign:string?, channel:string?, budget:i64?]
                                + Opt:Trace[semantic_source='j.spend.spend_monthly', source_role=&Dataset, originators=('j.spend',), physical_source='spend_monthly']
                      Project[$0, $1, $2]
                        Aggregate[$0, $1 => $0, $1, sum($2, overflow⇒[ERROR]):i64?]
                          Project[$0, if_then(equal($1, 'web'):boolean? -> 'WEB', _ -> 'OTHER'), $2, equal($0, 'A'):boolean?]
                            Read[warehouse.spend_daily => campaign:string?, channel:string?, clicks:i64?]
