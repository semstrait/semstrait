web_only_cpc_on_a_dataset_sums_the_formula_over_the_channels_the_request_does_not_group_by:
  # The CASE reads channel outside an aggregate and the request groups by month only, so the parts rule splits by the CASE parts and sums them: the web part is 150 / 50 = 3.0, and app and store share the ELSE part, which counts once as 0.5, so the month is 3.5 (summing per channel would give 4.0).
  model: models/spend_named_filter
  request:
    from: spend_flat
    select: [{dimension: date, granularity: month}, web_only_cpc]
  expect:
    rows:
      - [date, web_only_cpc]
      - [2026-03-01, 3.5]
  sql: SELECT d AS date, sum(CASE WHEN is_web THEN CAST(budget AS DOUBLE) / clicks ELSE 0.5 END) AS web_only_cpc FROM (SELECT CAST(date_trunc('month', day) AS DATE) AS d, channel = 'web' AS is_web, sum(budget) AS budget, sum(clicks) AS clicks FROM warehouse.spend_flat GROUP BY 1, 2) GROUP BY d
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:semstrait:datafusion
      @  3: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: equal
      #  2 @  2: date_trunc
      #  3 @  3: sum
      #  4 @  3: divide

    === Plan
    Root[date, web_only_cpc]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='spend_flat', compositions=0, granularity_fit=&Requested, granularity=&Day]
        Project[$0, if_then(equal($1, 1):boolean -> divide(($2)::!fp64?, ($3)::!fp64?, on_division_by_zero⇒[ERROR]):fp64?, _ -> 0.5)]
          Aggregate[$0, $3 => $0, $3, sum($1, overflow⇒[ERROR]):i64?, sum($2, overflow⇒[ERROR]):i64?]
