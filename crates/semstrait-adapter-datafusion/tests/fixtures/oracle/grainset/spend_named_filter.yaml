      Project[$2, $1, divide(($3)::!fp64?, ($0)::!fp64?, on_division_by_zero⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='spend', compositions=1, granularity_fit=&Requested, granularity=&Month]
        Project[$0, coalesce($1, $3):string?, coalesce($2, $4):date?, $5]
          Join[&Outer, and(is_not_distinct_from($2, $4):boolean, is_not_distinct_from($1, $3):boolean):boolean => $0, $1, $2, $3, $4, $5]
            + Opt:Trace[semantic_source='spend', source_role=&Grainset, cardinality=&OneToOne]
