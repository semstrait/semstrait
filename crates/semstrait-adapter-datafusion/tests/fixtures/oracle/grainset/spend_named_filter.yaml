  request:
    from: spend
    select: [{dimension: date, granularity: month}, campaign, users_per_budget]
  input_data:
    warehouse.spend_daily:
      - [2026-03-01, A, web, 1, u1]
      - [2026-03-02, A, web, 1, u2]
      - [2026-03-03, A, app, 1, u2]
      - [2026-03-04, A, app, 1, u3]
      - [2026-03-05, A, tv, 1, u4]
