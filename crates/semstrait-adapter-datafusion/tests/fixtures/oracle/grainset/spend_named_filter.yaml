      #  5 @  1: coalesce
      #  6 @  2: divide
      #  7 @  2: avg
      #  8 @  2: max

    === Plan
    Root[campaign, web_label_max_cpc_of_a]
      Project[$0, $1]
        + Opt:Trace[scope_root='j', compositions=2, granularity_fit=&NotSelected, granularity=&Month]
        + Opt:Trace[semantic_source='j', source_role=&Joinset, pruned=('j.campaigns',)]
        Aggregate[$0 => $0, max($1):fp64?]
