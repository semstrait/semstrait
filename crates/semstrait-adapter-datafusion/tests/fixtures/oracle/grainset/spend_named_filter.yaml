web_label_max_cpc_of_a_through_a_joinset_over_the_grainset:
  # The nested spend computes the filtered Metric as the public spend does: channel_label is a Dimension with no condition in each child: the Dataset twin's rows.
  model: models/spend_named_filter
  request:
    from: j
    select: [campaign, web_label_max_cpc_of_a]
  expect:
    rows:
      - [campaign, web_label_max_cpc_of_a]
      - [A, 10.0]
      - [B, null]
  sql: SELECT campaign, max(CASE WHEN label = 'WEB' THEN cpc ELSE 0.0 END) AS web_label_max_cpc_of_a FROM (SELECT coalesce(m.campaign, d.campaign) AS campaign, coalesce(m.label, d.label) AS label, avg(CAST(m.budget AS DOUBLE) / d.clicks) AS cpc FROM (SELECT campaign, CASE WHEN channel = 'web' THEN 'WEB' ELSE 'OTHER' END AS label, sum(budget) FILTER (WHERE campaign = 'A') AS budget FROM warehouse.spend_monthly GROUP BY 1, 2) m FULL JOIN (SELECT campaign, CASE WHEN channel = 'web' THEN 'WEB' ELSE 'OTHER' END AS label, sum(clicks) FILTER (WHERE campaign = 'A') AS clicks FROM warehouse.spend_daily GROUP BY 1, 2) d ON m.campaign IS NOT DISTINCT FROM d.campaign AND m.label IS NOT DISTINCT FROM d.label GROUP BY 1, 2) GROUP BY 1
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:io.substrait:functions_arithmetic
      @  3: extension:io.substrait:functions_boolean
    Functions:
