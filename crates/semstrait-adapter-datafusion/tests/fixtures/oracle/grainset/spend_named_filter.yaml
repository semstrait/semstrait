web_cpc2_at_month:
  # web_budget is the Month child's own filtered Metric, so its channel filter stays in that child's aggregate: 60 / 30 = 2.
  model: models/spend_named_filter
  request:
    from: spend
    select: [{dimension: date, granularity: month}, web_cpc2]
  input_data:
    warehouse.spend_daily:
      - [2026-03-10, A, web, 10, u1]
      - [2026-03-15, A, app, 20, u2]
    warehouse.spend_monthly:
      - [2026-03-01, A, web, 60]
      - [2026-03-01, A, app, 40]
  expect:
    rows:
      - [date, web_cpc2]
      - [2026-03-01, 2.0]
