clicks_beside_avg_cpc_on_a_dataset:
  # The reference at month: clicks is 10 + 30 + 40 = 80 in March and 20 in April; avg_cpc is 280 / 80 = 3.5 and 50 / 20 = 2.5.
  model: models/spend_named_filter
  request:
    from: spend_flat
    select: [{dimension: date, granularity: month}, clicks, avg_cpc]
  input_data:
    warehouse.spend_flat:
      - [2026-03-01, A, web, 10, 100, u1]
      - [2026-03-02, A, app, 30, 60, u2]
      - [2026-03-20, B, web, 40, 120, u1]
      - [2026-04-10, A, web, 20, 50, u1]
  expect:
    rows:
      - [date, clicks, avg_cpc]
      - [2026-03-01, 80, 3.5]
      - [2026-04-01, 20, 2.5]
  sql: SELECT coalesce(k.date, c.date) AS date, k.clicks, c.avg_cpc FROM (SELECT CAST(date_trunc('month', day) AS DATE) AS date, sum(clicks) AS clicks FROM warehouse.spend_flat GROUP BY 1) k FULL JOIN (SELECT date, avg(cpc) AS avg_cpc FROM (SELECT CAST(date_trunc('month', day) AS DATE) AS date, CAST(sum(budget) AS DOUBLE) / sum(clicks) AS cpc FROM warehouse.spend_flat GROUP BY 1) GROUP BY 1) c ON k.date IS NOT DISTINCT FROM c.date
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:semstrait:datafusion
      @  2: extension:io.substrait:functions_arithmetic
      @  3: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: date_trunc
      #  2 @  2: sum
      #  3 @  2: divide
      #  4 @  2: avg
      #  5 @  3: is_not_distinct_from

    === Plan
    Root[date, clicks, avg_cpc]
      Project[$0, $1, $3]
        + Opt:Trace[scope_root='spend_flat', compositions=0, granularity_fit=&Requested, granularity=&Day]
        Join[&Inner, is_not_distinct_from($0, $2):boolean => $0, $1, $2, $3]
          Aggregate[$1 => $1, sum($0, overflow⇒[ERROR]):i64?]
            Project[$0, (date_trunc('month', $1):date?)::!date?]
              Project[$1, $0]
                Read[warehouse.spend_flat => day:date?, clicks:i64?, budget:i64?]
                  + Opt:Trace[semantic_source='spend_flat', source_role=&Dataset, physical_source='spend_flat']
          Aggregate[$1 => $1, avg($0, overflow⇒[ERROR]):fp64?]
            Project[divide(($1)::!fp64?, ($2)::!fp64?, on_division_by_zero⇒[ERROR]):fp64?, $0]
              Aggregate[$2 => $2, sum($0, overflow⇒[ERROR]):i64?, sum($1, overflow⇒[ERROR]):i64?]
                Project[$0, $1, (date_trunc('month', $2):date?)::!date?]
                  Project[$2, $1, $0]
                    Read[warehouse.spend_flat => day:date?, clicks:i64?, budget:i64?]
                      + Opt:Trace[semantic_source='spend_flat', source_role=&Dataset, physical_source='spend_flat']

