# A named filter on a Grainset goes to the child that maps its names when the finer child alone does.

web_at_month:
  # The Month child maps no channel, so the Day child answers the filtered request.
  model: models/sales_named_filter
  request:
    from: sales_partial
    select: [{dimension: ordered_at, granularity: month}, revenue]
    filters: [web]
  expect:
    rows:
      - [ordered_at, revenue]
      - [2026-09-01, 40]
      - [2026-10-01, 150]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:semstrait:datafusion
      @  3: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: equal
      #  2 @  2: date_trunc
      #  3 @  3: sum

    === Plan
    Root[ordered_at, revenue]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='sales_partial', compositions=1, granularity_fit=&Requested, granularity=&Day]
        + Opt:Trace[semantic_source='sales_partial', source_role=&Grainset, answered_by='sales_partial.d']
        Project[(date_trunc('month', $0):date?)::!date?, $1]
          Filter[$2 => $0, $1, $2]
            Project[$0, $1, equal($2, 'web'):boolean?]
              Read[warehouse.d => day:date?, amount:i64?, channel:string?]
                + Opt:Trace[semantic_source='sales_partial.d', source_role=&Dataset, originators=('sales_partial',), physical_source='d']

no_filter_at_month:
  # With no filter, the Month child still answers.
  model: models/sales_named_filter
  request:
    from: sales_partial
    select: [{dimension: ordered_at, granularity: month}, revenue]
  expect:
    rows:
      - [ordered_at, revenue]
      - [2026-09-01, 40]
      - [2026-10-01, 360]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:semstrait:datafusion
      @  2: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: date_trunc
      #  2 @  2: sum

    === Plan
    Root[ordered_at, revenue]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
        + Opt:Trace[scope_root='sales_partial', compositions=1, granularity_fit=&Requested, granularity=&Month]
        + Opt:Trace[semantic_source='sales_partial', source_role=&Grainset, answered_by='sales_partial.m']
        Project[(date_trunc('month', $0):date?)::!date?, $1]
          Project[$0, $1]
            Read[warehouse.m => month_start:date?, amount:i64?]
              + Opt:Trace[semantic_source='sales_partial.m', source_role=&Dataset, originators=('sales_partial',), physical_source='m']
