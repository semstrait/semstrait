# A Grainset sends each name to its rank-first child, drilling across several with a Full join where they differ.

bypass_then_drill_across:
  # Reading no name of the outer Joinset's other operand keeps the Grainset alone, which drills across its own children.
  model: models/marketing_own_budget
  request:
    from: channel_spend
    select: [channel, total_budget, cost_m]
  input_data:
    warehouse.campaigns:
      - [A, null, null, null, 100.0]
      - [B, null, null, null, 50.0]
  expect:
    rows:
      - [channel, total_budget, cost_m]
      - [app, 100.0, 60.0]
      - [web, 150.0, 80.0]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
      @  2: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: sum
      #  2 @  2: equal
      #  3 @  2: is_not_distinct_from
      #  4 @  2: coalesce

    === Plan
    Root[channel, total_budget, cost_m]
      Project[$0, $2, $1]
        + Opt:Trace[scope_root='channel_spend', compositions=3, granularity_fit=&NotSelected, granularity=&Month]
        + Opt:Trace[semantic_source='channel_spend', source_role=&Joinset, pruned=('channel_spend.channels',)]
        Project[coalesce($0, $2):string?, $1, $3]
          Join[&Outer, is_not_distinct_from($0, $2):boolean => $0, $1, $2, $3]
            + Opt:Trace[semantic_source='channel_spend.g', source_role=&Grainset, originators=('channel_spend',), cardinality=&OneToOne]
            Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
              Project[$0, $1]
                Read[warehouse.monthly_spend => channel:string?, cost:fp64?]
                  + Opt:Trace[semantic_source='channel_spend.g.c_month', source_role=&Dataset, originators=('channel_spend.g',), physical_source='monthly_spend']
            Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
              Project[$0, $3]
                Join[&Inner, equal($1, $2):boolean? => $0, $1, $2, $3]
                  + Opt:Trace[semantic_source='channel_spend.g.c_day', source_role=&Joinset, originators=('channel_spend.g',), cardinality=&ManyToOne]
                  Aggregate[$1, $0 => $1, $0]
                    Project[$1, $0]
