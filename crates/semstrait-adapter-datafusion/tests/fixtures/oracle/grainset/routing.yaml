                Aggregate[$0, $1 => $0, $1]
                  Project[$0, $1]
                    Read[warehouse.campaigns => campaign:string?, region:string?]
                      + Opt:Trace[semantic_source='campaign_ads.campaigns', source_role=&Dataset, originators=('campaign_ads',), physical_source='campaigns']

