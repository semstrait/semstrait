nested_grainset_without_a_keyset_cannot_compute_a_metric_over_rows_of_two_children:
  # The children of spend_eu share no guaranteed keyset (neither declares a key), so spend_eu computes nothing, with no compile error, and the Joinset keeps web_click_days, which counts clicks per channel row and needs one child that maps click_id and channel: GrainNotServable.
  model: models/marketing_all_spend
  request:
    from: campaign_clicks
    select: [{dimension: date, granularity: month}, web_click_days]
  expect:
    error:
      stage: plan
      variant: GrainNotServable
      fields:
        path: [campaign_clicks, campaign_clicks.spend_eu]
        source: campaign_clicks.spend_eu
        requested: month
        source_granularity: month
  message: |-
    error: at `campaign_clicks / campaign_clicks.spend_eu`: the semantic source `campaign_clicks.spend_eu` at `month` cannot serve the requested granularity `month`; nearest: `campaign_clicks.spend_eu.spend_eu_clicks` lacks `channel`; `campaign_clicks.spend_eu.spend_eu_channels` lacks `click_count`, `campaign`

