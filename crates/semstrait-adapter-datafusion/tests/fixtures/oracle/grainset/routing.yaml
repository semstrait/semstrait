operand_kept_alone_each_name_from_its_rank_first_child_filtered_above_the_join:
  # A Grainset operand that its Joinset keeps alone takes each name from its rank-first child, and its Full join holds the NULL campaign once with each child's value; a predicate on the first child's Measure sits above that join, so it removes the campaign that only the other child holds.
  model: models/marketing_all_spend
  request:
    from: campaign_ads
    select: [campaign, cost, clicks]
    where: {gt: [clicks, 3]}
  expect:
    rows:
      - [campaign, cost, clicks]
      - [A, 40, 20]
      - [null, 9, 4]
  sql: SELECT * FROM (SELECT coalesce(k.campaign, c.campaign) AS campaign, c.cost, k.clicks FROM (SELECT campaign, sum(clicks) AS clicks FROM warehouse.ads_clicks GROUP BY campaign) k FULL JOIN (SELECT campaign, sum(cost) AS cost FROM warehouse.ads_cost GROUP BY campaign) c ON k.campaign IS NOT DISTINCT FROM c.campaign) g WHERE clicks > 3
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
      @  2: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: sum
      #  2 @  2: is_not_distinct_from
      #  3 @  2: gt
      #  4 @  2: coalesce

    === Plan
    Root[campaign, cost, clicks]
      Project[$0, $2, $1]
        + Opt:Trace[scope_root='campaign_ads', compositions=2, granularity_fit=&NotSelected]
        + Opt:Trace[semantic_source='campaign_ads', source_role=&Joinset, pruned=('campaign_ads.campaigns',)]
        Project[coalesce($0, $2):string?, $1, $3]
          Filter[gt($1, 3):boolean? => $0, $1, $2, $3]
            Join[&Outer, is_not_distinct_from($0, $2):boolean => $0, $1, $2, $3]
              + Opt:Trace[semantic_source='campaign_ads.ads', source_role=&Grainset, originators=('campaign_ads',), cardinality=&OneToOne]
              Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
                Project[$0, $1]
                  Read[warehouse.ads_clicks => campaign:string?, clicks:i64?]
                    + Opt:Trace[semantic_source='campaign_ads.ads.clicks_by_campaign', source_role=&Dataset, originators=('campaign_ads.ads',), physical_source='ads_clicks']
              Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
                Project[$0, $1]
                  Read[warehouse.ads_cost => campaign:string?, cost:i64?]
                    + Opt:Trace[semantic_source='campaign_ads.ads.cost_by_campaign', source_role=&Dataset, originators=('campaign_ads.ads',), physical_source='ads_cost']

operand_of_a_built_join_one_child_answers_whole:
  # Reading a name of the other operand builds the Joinset's join, so the Grainset operand gives partial aggregates and the one child that serves the whole demand answers alone.
  model: models/marketing_all_spend
