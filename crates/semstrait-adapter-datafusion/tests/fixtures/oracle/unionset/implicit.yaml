# A Dataset whose storage reduces to several physical sources becomes an Implicit Unionset.

path_token_disjoint_branches:
  # A path token that differs per object gives the Implicit Unionset's leaves their own disjoint value.
  model: models/commerce_own_types
  request:
    from: orders
    select: [channel, avg_amount]
  expect:
    rows:
      - [channel, avg_amount]
      - [a, 20.0]
      - [c, 50.0]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: avg

    === Plan
    Root[channel, avg_amount]
      Set[&UnionAll => $0, $1]
        + Opt:Trace[scope_root='orders', compositions=1, granularity_fit=&NotSelected]
        + Opt:Trace[semantic_source='orders', source_role=&Unionset, delivery=&FinalAggregates]
        Aggregate[$2 => $2, avg($0, overflow⇒[ERROR]):fp64?]
          Project[$1, $0, $2]
            Project[true, ($0)::!fp64?, 'c']
              Read[!{ReadRel} => amount:fp64?]
                + Opt:Trace[semantic_source='orders_orders', source_role=&Dataset, originators=('orders',), physical_source='orders']
        Project[$0, $1]
          Aggregate[$2 => $2, avg($0, overflow⇒[ERROR]):fp64?]
            Project[$1, $0, $2]
              Project[true, ($0)::!fp64?, 'a']
                Read[!{ReadRel} => amount:fp64?]
                  + Opt:Trace[semantic_source='orders_orders', source_role=&Dataset, originators=('orders',), physical_source='orders']

predicate_excludes_every_leaf:
  # A predicate that excludes every leaf of an Implicit Unionset reads an empty aggregate with no grouping.
  model: models/commerce_own_types
  request:
    from: orders
    select: [avg_amount]
    where: {eq: [channel, {lit: b}]}
  expect:
    rows:
      - [avg_amount]
      - [null]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: avg

    === Plan
    Root[avg_amount]
      Aggregate[_ => avg($0, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='orders', compositions=1, granularity_fit=&NotSelected]
        Project[$1, $0]
          Read:Virtual[_ => "ssu16.__plan_cond_avg_amount":boolean, "ssu16.avg_amount":fp64?]
            + Opt:Trace[semantic_source='orders', source_role=&Unionset, delivery=&Rows, pruned=('orders_orders', 'orders_orders')]

predicate_excludes_one_leaf:
  # A predicate that excludes one leaf of an Implicit Unionset reads the other leaf alone, with no union.
  model: models/commerce_own_types
  request:
    from: orders
    select: [avg_amount]
    where: {eq: [channel, {lit: a}]}
  expect:
    rows:
      - [avg_amount]
      - [20.0]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: equal
      #  2 @  2: avg

    === Plan
    Root[avg_amount]
      Aggregate[_ => avg($0, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='orders', compositions=1, granularity_fit=&NotSelected]
        Project[$1, $0]
          Filter[equal($2, 'a'):boolean => $0, $1, $2]
            + Opt:Trace[semantic_source='orders', source_role=&Unionset, delivery=&Rows, pruned=('orders_orders',)]
            Project[true, ($0)::!fp64?, 'a']
              Read[!{ReadRel} => amount:fp64?]
                + Opt:Trace[semantic_source='orders_orders', source_role=&Dataset, originators=('orders',), physical_source='orders']

two_tables_one_union:
  # A Dataset whose storage expands to two tables reads both under one union.
  model: models/commerce
  request:
    from: orders_two_tables
    select: [revenue]
  input_data:
    warehouse.eu_orders:
      - [null, null, 10.0]
      - [null, null, 20.0]
    warehouse.us_orders:
      - [null, 30.0]
  expect:
    rows:
      - [revenue]
      - [60.0]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: sum

    === Plan
    Root[revenue]
      Aggregate[_ => sum($0, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='orders_two_tables', compositions=1, granularity_fit=&NotSelected]
        Project[$0]
          Set[&UnionAll => $0]
            + Opt:Trace[semantic_source='orders_two_tables', source_role=&Unionset, delivery=&PartialAggregates]
            Aggregate[_ => sum($0, overflow⇒[ERROR]):fp64?]
              Project[$1, $0]
                Project[true, $0]
                  Read[warehouse.eu_orders => amount:fp64?]
                    + Opt:Trace[semantic_source='orders_two_tables_eu_orders', source_role=&Dataset, originators=('orders_two_tables',), physical_source='eu_orders']
            Project[$0]
              Aggregate[_ => sum($0, overflow⇒[ERROR]):fp64?]
                Project[$1, $0]
                  Project[true, $0]
                    Read[warehouse.us_orders => amount:fp64?]
                      + Opt:Trace[semantic_source='orders_two_tables_us_orders', source_role=&Dataset, originators=('orders_two_tables',), physical_source='us_orders']

two_paths_not_disjoint:
  # A Dataset over two base paths reads both under one union, since its branches are not disjoint.
  model: models/commerce
  request:
    from: sales_two_paths
    select: [order_year, total_amount]
  expect:
    rows:
      - [order_year, total_amount]
      - [2025, 10.0]
      - [2026, 26.5]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: sum

    === Plan
    Root[order_year, total_amount]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='sales_two_paths', compositions=1, granularity_fit=&NotSelected]
        Project[$0, $1]
          Set[&UnionAll => $0, $1]
            + Opt:Trace[semantic_source='sales_two_paths', source_role=&Unionset, delivery=&PartialAggregates]
            Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
              Project[$0, $2, $1]
                Project[($0)::!i32?, true, ($1)::!fp64?]
                  Read[!{ReadRel} => year:i32?, amount:fp64?]
                    + Opt:Trace[semantic_source='sales_two_paths_orders', source_role=&Dataset, originators=('sales_two_paths',), physical_source='orders']
            Project[$0, $1]
              Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
                Project[$0, $2, $1]
                  Project[($0)::!i32?, true, ($1)::!fp64?]
                    Read[!{ReadRel} => year:i32?, amount:fp64?]
                      + Opt:Trace[semantic_source='sales_two_paths_orders', source_role=&Dataset, originators=('sales_two_paths',), physical_source='orders']

predicate_over_union_columns:
  # A predicate on an Implicit Unionset's own column applies inside each branch, over the union's columns.
  model: models/commerce
  request:
    from: sales_two_paths
    select: [order_year, total_amount]
    where: {eq: [order_year, {lit: 2026}]}
  expect:
    rows:
      - [order_year, total_amount]
      - [2026, 26.5]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: equal
      #  2 @  2: sum

    === Plan
    Root[order_year, total_amount]
      Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='sales_two_paths', compositions=1, granularity_fit=&NotSelected]
        Project[$0, $1]
          Set[&UnionAll => $0, $1]
            + Opt:Trace[semantic_source='sales_two_paths', source_role=&Unionset, delivery=&PartialAggregates]
            Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
              Project[$0, $2, $1]
                Filter[equal($0, 2026:i32):boolean? => $0, $1, $2]
                  Project[($0)::!i32?, true, ($1)::!fp64?]
                    Read[!{ReadRel} => year:i32?, amount:fp64?]
                      + Opt:Trace[semantic_source='sales_two_paths_orders', source_role=&Dataset, originators=('sales_two_paths',), physical_source='orders']
            Project[$0, $1]
              Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):fp64?]
                Project[$0, $2, $1]
                  Filter[equal($0, 2026:i32):boolean? => $0, $1, $2]
                    Project[($0)::!i32?, true, ($1)::!fp64?]
                      Read[!{ReadRel} => year:i32?, amount:fp64?]
                        + Opt:Trace[semantic_source='sales_two_paths_orders', source_role=&Dataset, originators=('sales_two_paths',), physical_source='orders']
