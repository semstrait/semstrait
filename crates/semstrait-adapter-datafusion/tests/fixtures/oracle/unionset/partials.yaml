                            Project[$0, $2, $1, $2, and(equal($0, 'c'):boolean, $1):boolean]
                              Project['a', true, $0]
                                Read[!{ReadRel} => amount:fp64?]
                                  + Opt:Trace[semantic_source='u1.u2_orders', source_role=&Dataset, originators=('u1.u2',), physical_source='orders']
                          Project[$0, $1, $2]
                            Aggregate[$0 => $0, count($1, overflow⇒[ERROR]):i64, count($3, overflow⇒[ERROR]):i64]
                              Project[$0, $2, $1, $2, and(equal($0, 'c'):boolean, $1):boolean]
                                Project['c', true, $0]
                                  Read[!{ReadRel} => amount:fp64?]
                                    + Opt:Trace[semantic_source='u1.u2_orders', source_role=&Dataset, originators=('u1.u2',), physical_source='orders']

