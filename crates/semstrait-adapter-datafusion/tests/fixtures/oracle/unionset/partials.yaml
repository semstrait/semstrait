# A Unionset branch that is not a Dataset writes each Measure's partial under the entry that the union reads.

u1_counts_count_by_channel:
  model: models/u1_counts
  request:
    from: u1
    select: [channel, order_count]
  expect:
    rows:
      - [channel, order_count]
      - [a, 2.0]
      - [c, 3.0]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_aggregate_generic
      @  2: extension:io.substrait:functions_arithmetic
      @  3: extension:io.substrait:functions_comparison
    Functions:
      #  1 @  1: count
      #  2 @  2: sum
      #  3 @  3: coalesce

    === Plan
    Root[channel, order_count]
      Project[$0, (coalesce($1, 0):i64)::!fp64]
        + Opt:Trace[scope_root='u1', compositions=2, granularity_fit=&NotSelected]
        Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
          Project[$0, $1]
            Set[&UnionAll => $0, $1]
              + Opt:Trace[semantic_source='u1', source_role=&Unionset, delivery=&PartialAggregates]
              Aggregate[$0 => $0, count($1, overflow⇒[ERROR]):i64]
                Project[$0, $2, $1]
                  Project['c', true, $0]
                    Read[!{ReadRel} => amount:fp64?]
                      + Opt:Trace[semantic_source='u1.d9', source_role=&Dataset, originators=('u1',), physical_source='returns']
              Project[$0, $1]
                Aggregate[$0 => $0, sum($1, overflow⇒[ERROR]):i64?]
                  Project[$0, $1]
                    Set[&UnionAll => $0, $1]
                      + Opt:Trace[semantic_source='u1.u2', source_role=&Unionset, originators=('u1',), delivery=&PartialAggregates]
                      Aggregate[$0 => $0, count($1, overflow⇒[ERROR]):i64]
                        Project[$0, $2, $1]
                          Project['a', true, $0]
                            Read[!{ReadRel} => amount:fp64?]
                              + Opt:Trace[semantic_source='u1.u2_orders', source_role=&Dataset, originators=('u1.u2',), physical_source='orders']
                      Project[$0, $1]
                        Aggregate[$0 => $0, count($1, overflow⇒[ERROR]):i64]
                          Project[$0, $2, $1]
                            Project['c', true, $0]
                              Read[!{ReadRel} => amount:fp64?]
                                + Opt:Trace[semantic_source='u1.u2_orders', source_role=&Dataset, originators=('u1.u2',), physical_source='orders']

