        Project[(coalesce($2, 0):i64)::!fp64, $0, (coalesce($1, 0):i64)::!fp64]
          Aggregate[$1 => $1, sum($2, overflow⇒[ERROR]):i64?, sum($0, overflow⇒[ERROR]):i64?]
            Project[$2, $0, $1]
              Set[&UnionAll => $0, $1, $2]
