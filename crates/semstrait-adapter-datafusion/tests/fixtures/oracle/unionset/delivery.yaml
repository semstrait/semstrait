mixed_type_count_cast:
  # A count whose branches declare different argument types casts each branch's own argument to the wider type.
  model: models/commerce
  request:
    from: shipments
    select: [parcels, carriers]
  expect:
    rows:
      - [parcels, carriers]
      - [3, 2]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_aggregate_generic
    Functions:
      #  1 @  1: count

    === Plan
    Root[parcels, carriers]
      Project[$1, $0]
        + Opt:Trace[scope_root='shipments', compositions=1, granularity_fit=&NotSelected]
        Project[$1, ($0)::!i32]
          Aggregate[_ => count($2, overflow⇒[ERROR]):i64, count($0, overflow⇒[ERROR]):i64]
            Project[$1, $0, $3, $2]
              Set[&UnionAll => $0, $1, $2, $3]
