                    + Opt:Trace[semantic_source='shipments.road', source_role=&Dataset, originators=('shipments',), physical_source='road']

disjoint_branches_final_avg:
  # A literal that differs on each branch keeps them disjoint, so each gives its own finished average.
  model: models/marketing
  request:
    from: spend_all
    select: [channel, avg_cost]
  expect:
    rows:
      - [channel, avg_cost]
      - [web, 30.0]
      - [app, 40.0]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: avg

    === Plan
    Root[channel, avg_cost]
      Set[&UnionAll => $0, $1]
        + Opt:Trace[scope_root='spend_all', compositions=1, granularity_fit=&NotSelected, granularity=&Day]
        + Opt:Trace[semantic_source='spend_all', source_role=&Unionset, delivery=&FinalAggregates]
        Aggregate[$2 => $2, avg($0, overflow⇒[ERROR]):fp64?]
          Project[$1, $0, $2]
            Project[true, ($0)::!fp64?, 'app']
              Read[warehouse.spend_app => cost:i64?]
                + Opt:Trace[semantic_source='spend_all.app', source_role=&Dataset, originators=('spend_all',), physical_source='spend_app']
        Project[$0, $1]
          Aggregate[$2 => $2, avg($0, overflow⇒[ERROR]):fp64?]
            Project[$1, $0, $2]
              Project[true, ($0)::!fp64?, 'web']
                Read[warehouse.spend_web => cost:i64?]
                  + Opt:Trace[semantic_source='spend_all.web', source_role=&Dataset, originators=('spend_all',), physical_source='spend_web']

ratio_over_filtered_branches:
  # A non-additive count distinct keeps the branches giving rows, so a ratio's formula runs over one aggregate above the union.
  model: models/events
  request:
    from: visits
    select: [revenue_per_visitor, visitors]
  expect:
    rows:
      - [revenue_per_visitor, visitors]
      - [40.0, 3]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_comparison
      @  2: extension:io.substrait:functions_boolean
      @  3: extension:io.substrait:functions_arithmetic
      @  4: extension:io.substrait:functions_aggregate_generic
    Functions:
      #  1 @  1: equal
      #  2 @  2: and
      #  3 @  3: sum
      #  4 @  4: count
      #  5 @  3: divide

    === Plan
    Root[revenue_per_visitor, visitors]
      Project[divide($0, ($1)::!fp64, on_division_by_zero⇒[ERROR]):fp64?, $2]
        + Opt:Trace[scope_root='visits', compositions=1, granularity_fit=&NotSelected]
        Aggregate[_ => sum($0, overflow⇒[ERROR]):fp64?, count($1, overflow⇒[ERROR]):i64, count($4, overflow⇒[ERROR]):i64]
          Project[$2, $4, and(equal($0, 'web'):boolean?, $1):boolean?, and(equal($0, 'web'):boolean?, $3):boolean?, $4, $3]
            Set[&UnionAll => $0, $1, $2, $3, $4]
              + Opt:Trace[semantic_source='visits', source_role=&Unionset, delivery=&Rows]
              Project[$2, true, $0, true, $1]
                Read[warehouse.shop => amount:fp64?, visitor_id:string?, channel:string?]
                  + Opt:Trace[semantic_source='visits.shop_visits', source_role=&Dataset, originators=('visits',), physical_source='shop']
              Project[$2, true, $0, true, $1]
                Read[warehouse.web => amount:fp64?, visitor_id:string?, channel:string?]
                  + Opt:Trace[semantic_source='visits.web_visits', source_role=&Dataset, originators=('visits',), physical_source='web']
