# A Unionset leaves out a branch its predicate excludes, or fills a name it does not map.

branch_null_fill_unmapped:
  # A branch that maps no name writes a typed NULL for it in its own row projection.
  model: models/marketing_own_shape
  request:
    from: ad_platforms
    select: [country, market, cost]
  expect:
    rows:
      - [country, market, cost]
      - [SE, nordics, 11.0]
      - [DE, dach, 20.0]
      - [null, brand, 5.0]
      - [null, generic, 7.0]
  plan: |
    === Version 0.85.0
      producer: semstrait
    === Extensions
    URNs:
      @  1: extension:io.substrait:functions_arithmetic
    Functions:
      #  1 @  1: sum

    === Plan
    Root[country, market, cost]
      Aggregate[$1, $2 => $1, $2, sum($0, overflow⇒[ERROR]):fp64?]
        + Opt:Trace[scope_root='ad_platforms', compositions=1, granularity_fit=&NotSelected]
        Project[$2, $0, $1]
          Set[&UnionAll => $0, $1, $2]
            + Opt:Trace[semantic_source='ad_platforms', source_role=&Unionset, delivery=&PartialAggregates]
            Aggregate[$2, $3 => $2, $3, sum($0, overflow⇒[ERROR]):fp64?]
              Project[$1, $0, $2, $3]
                Project[true, $2, $0, $1]
                  Read[polaris.adwords => country:string?, market:string?, cost:fp64?]
                    + Opt:Trace[semantic_source='ad_platforms.adwords', source_role=&Dataset, originators=('ad_platforms',), physical_source='adwords']
            Project[$0, $1, $2]
              Aggregate[$2, $3 => $2, $3, sum($0, overflow⇒[ERROR]):fp64?]
                Project[$1, $0, $2, $3]
                  Project[true, $1, null:string?, $0]
                    Read[polaris.bing => campaign:string?, cost:fp64?]
                      + Opt:Trace[semantic_source='ad_platforms.bing', source_role=&Dataset, originators=('ad_platforms',), physical_source='bing']
            Project[$0, $1, $2]
              Aggregate[$2, $3 => $2, $3, sum($0, overflow⇒[ERROR]):fp64?]
                Project[$1, $0, $2, $3]
                  Project[true, $2, $0, $1]
                    Read[polaris.facebook => country:string?, market:string?, cost:fp64?]
                      + Opt:Trace[semantic_source='ad_platforms.facebook', source_role=&Dataset, originators=('ad_platforms',), physical_source='facebook']

literal_folds_prunes_branch:
