[package]
name = "semstrait"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "Facade crate for semstrait — semantic model to compute plan compiler"

[dependencies]
semstrait-core = { workspace = true }
semstrait-model = { workspace = true }
semstrait-planner = { workspace = true }
semstrait-manifest = { workspace = true }
semstrait-adapter = { workspace = true }
semstrait-catalog = { workspace = true }
semstrait-ir = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

[features]
default = ["duckdb"]
duckdb = ["semstrait-adapter/duckdb"]
datafusion = ["semstrait-adapter/datafusion"]
spark = ["semstrait-adapter/spark"]
catalog-iceberg = ["semstrait-catalog/iceberg"]
aws = ["semstrait-manifest/aws", "semstrait-catalog/aws"]
api-rest = ["dep:semstrait-api", "semstrait-api/rest"]
api-cli = ["dep:semstrait-api", "semstrait-api/cli"]
api-grpc = ["dep:semstrait-api", "semstrait-api/grpc"]

[dependencies.semstrait-api]
workspace = true
optional = true

[dev-dependencies]
serde_json = { workspace = true }
