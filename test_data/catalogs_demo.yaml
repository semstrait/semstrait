# Catalog connections — referenced by alias from dataset extras.catalog
catalogs:
  polaris:
    type: polaris
    name: example_warehouse
    url: https://polaris.example.com/api/catalog
    realm: POLARIS
    auth:
      method: aws_secrets
      secret_arn: arn:aws:secretsmanager:eu-west-1:123456789012:secret:polaris-credentials
      region: eu-west-1
      scope: "PRINCIPAL_ROLE:ALL"
