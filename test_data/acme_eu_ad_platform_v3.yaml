# Acme EU Paid Media — v3 (spec-driven model + bare semantic expressions)
#
# Adapted from `acme_eu_ad_platform_v2.yaml` to the new model surface:
#  - top-level `version:` / `namespace:` removed (no slot on YamlRoot).
#  - Dimension `type:` is required (categorical / metadata / temporal / …).
#  - `column_mapping:` → `semantic_mapping:`; literal arm
#    keyword renamed `literal:` → `lit:` for symmetry with `expr:` bodies.
#  - `extras.temporal:` flattened: `temporal: { events: { event_time }, grain }`
#    instead of nested `temporal.type.events.occurred_at`.
#  - `expr:` blocks name each operation by its declaration's tag, and each
#    function by its name or an alias in the function catalog (ADR 0089, rule 4):
#      Leaves:     lit / col / field / dim / measure / metric
#      Operations: add subtract multiply divide safe_divide mod
#                  eq not_eq lt lt_eq gt gt_eq and or negate not
#                  in between like ilike not_like not_ilike is_null
#                  (`not:` also folds into in / between / like / ilike)
#      Tree tags:  case if cast
#      Functions:  the catalog's scalar functions, here concat upper
#                  regexp_like regexp_extract
#    Aggregation is stated through `agg:`, never in an expression body.
#  - Metric `expr:` use block form (`{divide: [a, b]}`); they parse to a bare
#    `Expr`.
#  - the retired `keys:` block → per-site `is_key:` / `keysets:` (ADR 0039).
#  - each Dataset reads one Parquet folder, `s3://semstrait-e2e/example/exports/
#    acme/eu/<platform>/<account>/`, whose tokens 5 and 6 feed
#    `dataset_name` and `export_account_id` (ADR 0070, ADR 0081).

semantic_model:
  name: acme-eu-ad-platforms
  description: Cross-platform paid media metrics (independent variables for MMM)
  ai_context:
    description: >
      Paid media metrics across Google Ads, Facebook, Bing, TikTok, Impact, Klaviyo
      for Acme EU (DE, ES, FR, GB, IT). Independent variables (X) for MMM.
  labels: [mmm, acme, eu, paid-media, independent-variables]

  # ─── Shared dimensions ───────────────────────────────────────────────
  dimensions:
    - name: dataset_name
      data_type: string
      description: "Namespace extraction, platform name or source of data in current model version"
      type:
        metadata:
          source:
            path:
              token: 5

    - name: export_account_id
      description: "Export account UUID extracted from resolved S3 location path"
      data_type: string
      type:
        metadata:
          source:
            path:
              token: 6

    - name: date
      description: "Reporting date"
      data_type: date
      type:
        temporal:
          granularities: [day, week, month, quarter, year]

    - name: campaign
      description: "Campaign name"
      data_type: string
      type: categorical
      ai_context:
        synonyms:
          campaign: [ad campaign]

    - name: country
      description: "Country where the ad was served or the audience is located"
      data_type: string
      type: categorical

    # `market` is computed-only — declared inline at each Public DataKind
    # below. No root-pool entry (would otherwise draw
    # `OrphanSharedSemantics`, since every site shadows it with its own
    # `expr:`).

    - name: measurement_channel
      description: "Marketing channel classification (Paid Search, Paid Social, Video, Affiliates, Email)"
      data_type: string
      type: categorical
      ai_context:
        synonyms:
          channel: [ad channel, marketing channel]

    - name: traffic_source
      description: "Traffic source platform name (Google, Bing, Facebook, Tiktok, Impact, Klaviyo)"
      data_type: string
      type: categorical
      ai_context:
        synonyms:
          traffic_source: [platform]

    - name: measurement_source
      description: "Measurement source identifier"
      data_type: string
      type: categorical
      expr:
        concat:
          - measurement_channel
          - lit: " - "
          - traffic_source

    - name: currency
      description: "Currency of the reported monetary values"
      data_type: string
      type: categorical

  # ─── Shared measures ─────────────────────────────────────────────────
  measures:
    - name: cost
      description: "Total ad spend in account currency"
      data_type: decimal(18,2)
      agg: sum
      ai_context:
        synonyms:
          cost: [ad cost, ad spend, spend]

    - name: clicks
      description: "Number of clicks on the ad"
      data_type: decimal(18,2)
      agg: sum

    - name: impressions
      description: "Number of times the ad was displayed on screen"
      data_type: decimal(18,2)
      agg: sum

    - name: platform_conversions
      description: "Total tracked conversions attributed to ads"
      data_type: decimal(18,2)
      agg: sum
      ai_context:
        synonyms:
          conversions: [conv, total conversions]

    - name: platform_revenue
      description: "Revenue attributed to ad platform"
      data_type: decimal(18,2)
      agg: sum

    - name: actions
      description: "Actions performed in a campaign"
      data_type: decimal(18,2)
      agg: sum

  # ─── Shared metrics ──────────────────────────────────────────────────
  # Block-form exprs — parser stores a bare `Expr`.
  metrics:
    - name: cpc
      description: "Cost per click"
      data_type: decimal(18,4)
      expr:
        divide: [cost, clicks]

    - name: cpm
      description: "Cost per thousand impressions"
      data_type: decimal(18,4)
      expr:
        multiply:
          - divide: [cost, impressions]
          - 1000

    - name: ctr
      description: "Click-through rate"
      data_type: decimal(18,4)
      expr:
        divide: [clicks, impressions]

    - name: cpa
      description: "Cost per conversion"
      data_type: decimal(18,4)
      expr:
        divide: [cost, platform_conversions]

    - name: roas
      description: "Return on ad spend"
      data_type: decimal(18,4)
      expr:
        divide: [platform_revenue, cost]

    - name: conversion_rate
      description: "Share of clicks resulting in a conversion"
      data_type: decimal(18,4)
      expr:
        divide: [platform_conversions, clicks]

  # ═════════════════════════════════════════════════════════════════════
  # Kind: Paid Media Campaign Performance
  # ═════════════════════════════════════════════════════════════════════
  unionsets:
    - name: paid_media_campaign_performance
      description: "Cross-platform paid media performance unified across Google Ads, Bing Ads, Facebook/Meta, and TikTok"
      ai_context:
        description: "Use for cross-channel paid media analysis. Filter by platform or campaign_category (search/social). Hierarchy: campaign > adgroup > ad."
      mode: all

      # NOTE: `temporal.granularity:` is forbidden on a complex DataKind. The
      # shape (`events`) cascades from this unionset; each nested Dataset
      # below authors its own `granularity:`.
      extras:
        temporal:
          events:
            event_time: date

      dimensions:
        # ── 1. Metadata & classification ─────────────────────────────
        # Keyness is per-site (ADR 0039): `date` sits in both keysets, and
        # each of the other two members names just one.
        - ref: date
          is_key: true
          keysets: [platform, natural]
        - ref: dataset_name
        - ref: campaign
          is_key: true
          keyset: natural
        - ref: country
        - ref: traffic_source
        - ref: measurement_source
        - ref: measurement_channel
        - ref: currency
        - ref: export_account_id
          is_key: true
          keyset: platform

        # Computed dimension: derives market code from campaign name and dataset_name.
        # Inline `name:` (not `ref:`) because RefEntry only allows expr override
        # against an existing root-pool entry; here we shadow the pool entry's
        # default with a computed expression.
        - name: market
          description: "Derived market code from campaign naming conventions"
          data_type: string
          type: categorical
          expr:
            case:
              whens:
                # Branch 1: ad-platform datasets
                - when:
                    in:
                      value: dataset_name
                      list:
                        - lit: "adwords"
                        - lit: "facebookads"
                        - lit: "bing"
                        - lit: "tiktok"
                        - lit: "klaviyo"
                  then:
                    case:
                      whens:
                        # UK_ prefix → GB
                        - when:
                            regexp_like:
                              - campaign
                              - lit: "^UK_"
                          then:
                            lit: "GB"
                        # Facebook special-case
                        - when:
                            eq:
                              - dataset_name
                              - lit: "facebookads"
                          then:
                            case:
                              whens:
                                - when:
                                    regexp_like:
                                      - campaign
                                      - lit: "^EU_"
                                  then:
                                    upper: country
                              else:
                                upper:
                                  regexp_extract:
                                    - campaign
                                    - lit: "^([A-Z]{2})_"
                                    - lit: 1
                      else:
                        upper:
                          regexp_extract:
                            - campaign
                            - lit: "^([A-Z]{2})_"
                            - lit: 1

                # Branch 2: impact dataset
                - when:
                    eq:
                      - dataset_name
                      - lit: "impact"
                  then:
                    case:
                      whens:
                        - when:
                            regexp_like:
                              - campaign
                              - lit: "^Acme UK"
                          then:
                            lit: "GB"
                      else:
                        regexp_extract:
                          - campaign
                          - lit: "^Acme ([A-Z]{2})"
                          - lit: 1
              else:
                lit: ""

      # ── Measures ──────────────────────────────────────────────────────
      measures:
        - ref: cost
        - ref: clicks
        - ref: impressions
        - ref: platform_conversions
        - ref: platform_revenue
        - ref: actions

      # ── Metrics ───────────────────────────────────────────────────────
      metrics:
        - ref: cpc
        - ref: cpm
        - ref: ctr
        - ref: cpa
        - ref: roas
        - ref: conversion_rate

      # ── Datasets ──────────────────────────────────────────────────────
      datasets:
        # ── Google Ads ────────────────────────────────────────────────
        - name: adwords_campaign_data
          extras:
            catalog: polaris
            storage:
              format: parquet
              paths:
                - s3://semstrait-e2e/example/exports/acme/eu/adwords/5f3a9c2e-8b41-4d6a-9e07-2c1b4a7d8e90/
            temporal:
              events:
                event_time: date
              granularity: day
            semantic_mapping:
              measurement_channel:
                lit: { string: "Paid Search" }
              traffic_source:
                lit: { string: "Google" }
              date: date
              country: adwords-country
              campaign: adwords-campaign
              currency: currency
              cost: adwords-cost
              clicks: adwords-clicks
              impressions: adwords-impressions
              platform_conversions: adwords_conversions
              platform_revenue: adwords_allConvValue
              actions:
                lit: 0

        # ── Bing Ads ──────────────────────────────────────────────────
        - name: bing_campaign_data
          extras:
            catalog: polaris
            storage:
              format: parquet
              paths:
                - s3://semstrait-e2e/example/exports/acme/eu/bing/5f3a9c2e-8b41-4d6a-9e07-2c1b4a7d8e90/
            temporal:
              events:
                event_time: date
              granularity: day
            semantic_mapping:
              measurement_channel:
                lit: { string: "Paid Search" }
              traffic_source:
                lit: { string: "Bing" }
              date: date
              campaign: bing-CampaignName
              currency: currency
              impressions: bing-impressions
              clicks: bing-clicks
              cost: bing-cost
              platform_conversions: bing-Conversions
              platform_revenue: bing-Revenue
              actions:
                lit: 0

        # ── Facebook / Meta ───────────────────────────────────────────
        - name: facebook_adset_data
          extras:
            catalog: polaris
            storage:
              format: parquet
              paths:
                - s3://semstrait-e2e/example/exports/acme/eu/facebookads/5f3a9c2e-8b41-4d6a-9e07-2c1b4a7d8e90/
            temporal:
              events:
                event_time: date
              granularity: day
            semantic_mapping:
              measurement_channel:
                lit: { string: "Paid Social" }
              traffic_source:
                lit: { string: "Facebook" }
              date: date
              country: facebookads-country
              campaign: facebookads-campaign_name
              currency: currency
              cost: facebookads-spend
              impressions: facebookads-impressions
              clicks: facebookads-clicks
              platform_conversions:
                lit: 0
              platform_revenue:
                lit: 0
              actions:
                lit: 0

        # ── TikTok ────────────────────────────────────────────────────
        - name: tiktok_ad_data
          extras:
            catalog: polaris
            storage:
              format: parquet
              paths:
                - s3://semstrait-e2e/example/exports/acme/eu/tiktok/5f3a9c2e-8b41-4d6a-9e07-2c1b4a7d8e90/
            temporal:
              events:
                event_time: date
              granularity: day
            semantic_mapping:
              measurement_channel:
                lit: { string: "Video" }
              traffic_source:
                lit: { string: "Tiktok" }
              date: date
              country: tiktok-country
              campaign: tiktok-campaign_name
              currency: currency
              cost: tiktok-stat_cost
              impressions: tiktok-show_cnt
              clicks: tiktok-click_cnt
              platform_conversions: tiktok-convert_cnt
              platform_revenue:
                lit: 0
              actions:
                lit: 0

        # ── Impact ────────────────────────────────────────────────────
        - name: impact_adset_data
          extras:
            catalog: polaris
            storage:
              format: parquet
              paths:
                - s3://semstrait-e2e/example/exports/acme/eu/impact/5f3a9c2e-8b41-4d6a-9e07-2c1b4a7d8e90/
            temporal:
              events:
                event_time: date
              granularity: day
            semantic_mapping:
              measurement_channel:
                lit: { string: "Affiliates" }
              traffic_source:
                lit: { string: "Impact" }
              date: date
              country: impact-country
              campaign: impact-campaign_name
              currency: currency
              cost: impact-client_cost
              impressions:
                lit: 0
              clicks:
                lit: 0
              platform_conversions:
                lit: 0
              platform_revenue: impact-amount
              actions: impact-actions

        # ── Klaviyo ───────────────────────────────────────────────────
        - name: klaviyo_adset_data
          extras:
            catalog: polaris
            storage:
              format: parquet
              paths:
                - s3://semstrait-e2e/example/exports/acme/eu/klaviyo/5f3a9c2e-8b41-4d6a-9e07-2c1b4a7d8e90/
            temporal:
              events:
                event_time: date
              granularity: day
            semantic_mapping:
              measurement_channel:
                lit: { string: "Email" }
              traffic_source:
                lit: { string: "Klaviyo" }
              date: date
              country:
                lit: { string: "" }
              campaign: klaviyo-campaign_name
              currency:
                lit: { string: "" }
              cost:
                lit: 0
              impressions:
                lit: 0
              clicks: klaviyo-clicks2
              platform_conversions:
                lit: 0
              platform_revenue:
                lit: 0
              actions:
                lit: 0

  # ═════════════════════════════════════════════════════════════════════
  # Standalone Dataset: Shopify
  # ═════════════════════════════════════════════════════════════════════
  datasets:
    - name: shopify
      extras:
        catalog: polaris
        storage:
          format: parquet
          paths:
            - s3://semstrait-e2e/example/exports/acme/eu/shopify/5f3a9c2e-8b41-4d6a-9e07-2c1b4a7d8e90/
        temporal:
          events:
            event_time: date
          granularity: day
        semantic_mapping:
          date: date
          brand:
            lit: { string: "Acme" }
          conversion_event:
            lit: { string: "purchase" }
          currency: currency
          order_action_type: shopify-order_action_type
          sale_action_type: shopify-sale_action_type
          sale_line_type: sale_line_type
          sales_channel: order_app_name
          orders: shopify-orders
          revenue: shopify-total_amount
          tax: shopify-total_tax_amount
          country: shopify-shipping_country

      dimensions:
        - ref: dataset_name
        - ref: export_account_id
        - ref: date
        - ref: currency
        - ref: country
        - name: market
          description: "Derived market code from Shopify country name"
          data_type: string
          type: categorical
          expr:
            case:
              whens:
                - when:
                    eq: [country, { lit: "Germany" }]
                  then:
                    lit: "DE"
                - when:
                    eq: [country, { lit: "Spain" }]
                  then:
                    lit: "ES"
                - when:
                    eq: [country, { lit: "France" }]
                  then:
                    lit: "FR"
                - when:
                    eq: [country, { lit: "United Kingdom" }]
                  then:
                    lit: "GB"
                - when:
                    eq: [country, { lit: "Italy" }]
                  then:
                    lit: "IT"
              else:
                lit: null
        - name: sales_channel
          data_type: string
          type: categorical
        - name: brand
          data_type: string
          type: categorical
        - name: conversion_event
          data_type: string
          type: categorical
        - name: sale_line_type
          data_type: string
          type: categorical
        - name: sale_action_type
          data_type: string
          type: categorical
        - name: order_action_type
          data_type: string
          type: categorical

      measures:
        - name: orders
          data_type: decimal(18,2)
          agg: sum
        - name: revenue
          data_type: decimal(18,2)
          agg: sum
        - name: tax
          data_type: decimal(18,2)
          agg: sum
